<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ragdoll Range</title>
<style>
  :root { --accent: #ff3b3b; --text: #f2f2f2; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: "Segoe UI", system-ui, sans-serif; color: var(--text); }
  canvas { display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; }
  #crosshair { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
  #crosshair i { position: absolute; background: rgba(255,255,255,.9); box-shadow: 0 0 2px #000; }
  #crosshair .t { width: 2px; height: 9px; left: -1px; }
  #crosshair .l { width: 9px; height: 2px; top: -1px; }
  #hitmarker { position: absolute; left: 50%; top: 50%; width: 26px; height: 26px; margin: -13px; opacity: 0; transition: opacity .12s; }
  #hitmarker::before, #hitmarker::after { content: ""; position: absolute; left: 12px; top: -2px; width: 2px; height: 30px; background: #fff; transform: rotate(45deg); }
  #hitmarker::after { transform: rotate(-45deg); }
  #hitmarker.head::before, #hitmarker.head::after { background: var(--accent); }
  #ammo { position: absolute; right: 36px; bottom: 30px; text-align: right; text-shadow: 0 2px 8px #000; }
  #ammo .count { font-size: 46px; font-weight: 700; letter-spacing: 1px; }
  #ammo .count small { font-size: 22px; opacity: .55; font-weight: 500; }
  #ammo .name { font-size: 13px; letter-spacing: 4px; opacity: .7; text-transform: uppercase; }
  #ammo .reload { font-size: 13px; letter-spacing: 3px; color: var(--accent); height: 16px; }
  #feed { position: absolute; left: 50%; top: 58%; transform: translateX(-50%); font-size: 22px; font-weight: 800; letter-spacing: 6px; color: var(--accent); text-shadow: 0 2px 10px #000; opacity: 0; transition: opacity .25s, transform .25s; }
  #feed.show { opacity: 1; transform: translateX(-50%) translateY(-6px); }
  #stats { position: absolute; left: 30px; bottom: 30px; font-size: 13px; letter-spacing: 2px; opacity: .75; text-shadow: 0 2px 6px #000; line-height: 1.7; }
  #slowmo { position: absolute; left: 50%; top: 24px; transform: translateX(-50%); font-size: 13px; letter-spacing: 6px; color: #8fd3ff; opacity: 0; transition: opacity .3s; }
  #screenBlood { position: absolute; inset: 0; width: 100%; height: 100%; }
  #vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55)); }
  #start { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(ellipse at center, rgba(20,8,8,.55), rgba(0,0,0,.92)); cursor: pointer; }
  #start .card { text-align: center; }
  #start h1 { margin: 0; font-size: 64px; letter-spacing: 14px; font-weight: 900; }
  #start h1 span { color: var(--accent); }
  #start p { opacity: .6; letter-spacing: 3px; margin: 10px 0 34px; }
  #start .keys { display: grid; grid-template-columns: auto auto; gap: 8px 26px; text-align: left; font-size: 14px; opacity: .85; }
  #start kbd { display: inline-block; min-width: 18px; padding: 2px 7px; border: 1px solid rgba(255,255,255,.35); border-radius: 5px; font-family: inherit; font-size: 12px; text-align: center; margin-right: 8px; }
  #start .go { margin-top: 34px; font-size: 13px; letter-spacing: 6px; color: var(--accent); animation: pulse 1.6s infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
  }
}
</script>
</head>
<body>
<div id="hud">
  <div id="vignette"></div>
  <canvas id="screenBlood"></canvas>
  <div id="crosshair"><i class="t" id="ch-t"></i><i class="t" id="ch-b"></i><i class="l" id="ch-l"></i><i class="l" id="ch-r"></i></div>
  <div id="hitmarker"></div>
  <div id="feed"></div>
  <div id="slowmo">SLOW MOTION</div>
  <div id="stats"></div>
  <div id="ammo"><div class="reload" id="reloadText"></div><div class="count" id="ammoCount">12<small> / ∞</small></div><div class="name" id="weaponName">Pistol</div></div>
</div>
<div id="start">
  <div class="card">
    <h1>RAGDOLL<span>RANGE</span></h1>
    <p>CLICK TO PLAY</p>
    <p id="loading" style="color:#ff6b6b">LOADING MODELS...</p>
    <div class="keys">
      <div><kbd>W A S D</kbd>Move</div><div><kbd>Shift</kbd>Sprint</div>
      <div><kbd>Mouse 1</kbd>Shoot</div><div><kbd>Mouse 2</kbd>Aim down sights</div>
      <div><kbd>R</kbd>Reload</div><div><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd>Pistol / Rifle / Shotgun</div>
      <div><kbd>E</kbd>Spawn target</div><div><kbd>T</kbd>Change target model</div><div><kbd>C</kbd>Clean up</div>
      <div><kbd>Q</kbd>Slow motion</div><div><kbd>Space</kbd>Jump</div>
    </div>
    <div class="go">CLICK ANYWHERE</div>
  </div>
</div>

<script type="module">
import * as THREE from "three";
import * as CANNON from "cannon-es";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import * as SkeletonUtils from "three/addons/utils/SkeletonUtils.js";

// ---------------------------------------------------------------- renderer, scene, camera
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.matrixWorldAutoUpdate = false; // updated by hand each frame, then ragdoll bones are written on top
scene.background = new THREE.Color(0x0d0e10);
scene.fog = new THREE.Fog(0x0d0e10, 14, 34);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

const camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.01, 120);
camera.rotation.order = "YXZ";
scene.add(camera);

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---------------------------------------------------------------- sound: everything is synthesised with Web Audio
const Sound = (() => {
  let ctx = null, master, reverbIn, noiseBuf;
  function init() {
    if (ctx) { ctx.resume(); return; }
    ctx = new AudioContext();
    master = ctx.createDynamicsCompressor(); master.threshold.value = -10; master.ratio.value = 6;
    const vol = ctx.createGain(); vol.gain.value = 0.9; master.connect(vol); vol.connect(ctx.destination);
    // a concrete room: decaying noise as the reverb impulse
    const conv = ctx.createConvolver(), len = (ctx.sampleRate * 1.8) | 0, ir = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.5); }
    conv.buffer = ir; reverbIn = ctx.createGain(); reverbIn.gain.value = 0.32; reverbIn.connect(conv); conv.connect(master);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const nd = noiseBuf.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
  }
  function out(pos, wet = 1) {
    const g = ctx.createGain();
    let tail = g;
    if (pos) {
      const pan = ctx.createPanner(); pan.panningModel = "HRTF"; pan.distanceModel = "inverse"; pan.refDistance = 2.5; pan.rolloffFactor = 1.1;
      pan.positionX.value = pos.x; pan.positionY.value = pos.y; pan.positionZ.value = pos.z;
      g.connect(pan); tail = pan;
    }
    tail.connect(master);
    if (wet > 0) { const w = ctx.createGain(); w.gain.value = wet; tail.connect(w); w.connect(reverbIn); }
    return g;
  }
  function noise(dest, t, dur, type, freq, q, gain, attack = 0.002) {
    const src = ctx.createBufferSource(); src.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
    const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(dest); src.start(t, Math.random() * 1.5); src.stop(t + dur + 0.05);
    return f;
  }
  function tone(dest, t, dur, f0, f1, gain, type = "sine") {
    const o = ctx.createOscillator(); o.type = type;
    o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
    const g = ctx.createGain(); g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest); o.start(t); o.stop(t + dur + 0.05);
  }
  const ok = () => ctx && ctx.state === "running";
  const now = () => ctx.currentTime;
  return {
    init,
    listener(cam) {
      if (!ok()) return;
      const l = ctx.listener, p = cam.getWorldPosition(new THREE.Vector3()), f = new THREE.Vector3(0, 0, -1).applyQuaternion(cam.quaternion), u = new THREE.Vector3(0, 1, 0).applyQuaternion(cam.quaternion);
      if (l.positionX) { l.positionX.value = p.x; l.positionY.value = p.y; l.positionZ.value = p.z; l.forwardX.value = f.x; l.forwardY.value = f.y; l.forwardZ.value = f.z; l.upX.value = u.x; l.upY.value = u.y; l.upZ.value = u.z; }
      else { l.setPosition(p.x, p.y, p.z); l.setOrientation(f.x, f.y, f.z, u.x, u.y, u.z); }
    },
    shot(kind) {
      if (!ok()) return;
      const t = now(), d = out(null, 1.2), big = kind === "shotgun" ? 1.5 : kind === "rifle" ? 1.05 : 0.85;
      noise(d, t, 0.07 * big, "highpass", 1800, 0.4, 0.9);
      noise(d, t, 0.32 * big, "lowpass", kind === "pistol" ? 1400 : 900, 0.6, 0.9 * big);
      tone(d, t, 0.2 * big, 150, 38, 1.0 * big);
      noise(d, t + 0.015, 0.7 * big, "bandpass", 350, 0.5, 0.22 * big, 0.02);
      if (kind === "rifle") tone(d, t, 0.05, 2400, 900, 0.08, "square");
    },
    click(gain = 0.25, f = 2600, pos) { if (!ok()) return; const t = now(), d = out(pos, 0.3); noise(d, t, 0.03, "bandpass", f, 3, gain); tone(d, t, 0.02, f * 1.3, f, gain * 0.4, "triangle"); },
    dry() { this.click(0.35, 3200); },
    magOut() { if (!ok()) return; const t = now(), d = out(null, 0.3); noise(d, t, 0.05, "bandpass", 2200, 4, 0.3); noise(d, t + 0.03, 0.12, "bandpass", 1200, 2, 0.15); },
    magIn() { if (!ok()) return; const t = now(), d = out(null, 0.3); noise(d, t, 0.06, "bandpass", 1500, 3, 0.35); tone(d, t, 0.05, 900, 500, 0.15, "triangle"); },
    rack() { if (!ok()) return; const t = now(), d = out(null, 0.4); noise(d, t, 0.06, "bandpass", 1900, 3, 0.35); noise(d, t + 0.12, 0.07, "bandpass", 2600, 3, 0.4); tone(d, t + 0.12, 0.04, 1600, 900, 0.15, "triangle"); },
    magFloor(pos) { if (!ok()) return; const t = now(), d = out(pos, 0.5); noise(d, t, 0.08, "bandpass", 900, 2, 0.4); tone(d, t, 0.12, 700, 420, 0.12, "triangle"); },
    shell(pos) { if (!ok()) return; const t = now(), d = out(pos, 0.4); const f = rand(4200, 6200); tone(d, t, 0.18, f, f * 0.97, 0.08); tone(d, t, 0.12, f * 1.51, f * 1.5, 0.04); },
    flesh(pos, heavy) {
      if (!ok()) return; const t = now(), d = out(pos, 0.5);
      noise(d, t, 0.16, "lowpass", 650, 1.2, heavy ? 0.9 : 0.6);
      noise(d, t + 0.01, 0.22, "bandpass", 240, 2.5, 0.5);
      tone(d, t, 0.14, 110, 45, heavy ? 0.7 : 0.45);
    },
    crunch(pos) { if (!ok()) return; const t = now(), d = out(pos, 0.5); for (let i = 0; i < 5; i++) noise(d, t + i * 0.012, 0.04, "bandpass", rand(1200, 2600), 4, 0.35); this.flesh(pos, true); },
    gore(pos) {
      if (!ok()) return; const t = now(), d = out(pos, 0.6);
      for (let i = 0; i < 7; i++) noise(d, t + rand(0, 0.35), rand(0.08, 0.2), "lowpass", rand(400, 900), 1.5, rand(0.25, 0.5));
      tone(d, t, 0.3, 70, 30, 0.6); noise(d, t, 0.5, "bandpass", 180, 1.5, 0.35, 0.01);
    },
    splat(pos, gain = 0.2) { if (!ok()) return; const t = now(), d = out(pos, 0.3); noise(d, t, 0.1, "lowpass", 800, 1.5, gain); },
    thud(pos, strength) { if (!ok()) return; const t = now(), d = out(pos, 0.4), g = Math.min(1, strength / 6); tone(d, t, 0.18, 95, 40, 0.7 * g); noise(d, t, 0.12, "lowpass", 350, 1, 0.5 * g); },
    metal(pos) { if (!ok()) return; const t = now(), d = out(pos, 0.6); for (const f of [rand(900, 1300), rand(1900, 2500), rand(3100, 3700)]) tone(d, t, 0.5, f, f * 0.99, 0.12, "triangle"); noise(d, t, 0.05, "highpass", 3000, 1, 0.4); },
    ricochet(pos) { if (!ok()) return; const t = now(), d = out(pos, 0.7); noise(d, t, 0.06, "highpass", 2500, 1, 0.4); if (Math.random() < 0.35) tone(d, t + 0.01, 0.3, rand(2600, 3400), rand(900, 1300), 0.07, "triangle"); },
    step(gain = 0.13) { if (!ok()) return; const t = now(), d = out(null, 0.1); noise(d, t, 0.09, "lowpass", 420, 1, gain); },
  };
})();

// ---------------------------------------------------------------- procedural textures
function canvasTexture(w, h, draw, repeat) {
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  draw(c.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }
  return t;
}
const rand = (a, b) => a + Math.random() * (b - a);

const concreteTex = canvasTexture(512, 512, (g, w, h) => {
  g.fillStyle = "#4a4b4e"; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 9000; i++) {
    const v = rand(45, 95) | 0;
    g.fillStyle = `rgba(${v},${v},${v + 3},${rand(0.05, 0.25)})`;
    g.fillRect(rand(0, w), rand(0, h), rand(1, 4), rand(1, 4));
  }
  g.strokeStyle = "rgba(20,20,22,.6)"; g.lineWidth = 3;
  g.strokeRect(0, 0, w, h);
}, [8, 11]);
const wallTex = canvasTexture(512, 512, (g, w, h) => {
  g.fillStyle = "#3b3f45"; g.fillRect(0, 0, w, h);
  for (let y = 0; y < h; y += 64) for (let x = (y / 64) % 2 ? -64 : 0; x < w; x += 128) {
    const v = rand(52, 70) | 0;
    g.fillStyle = `rgb(${v},${v + 3},${v + 8})`;
    g.fillRect(x + 3, y + 3, 122, 58);
  }
  for (let i = 0; i < 4000; i++) { g.fillStyle = `rgba(0,0,0,${rand(0, .12)})`; g.fillRect(rand(0, w), rand(0, h), 2, 2); }
}, [6, 2]);
const dummyChestTex = canvasTexture(256, 256, (g, w, h) => {
  g.fillStyle = "#e8b520"; g.fillRect(0, 0, w, h);
  const cx = w / 2, cy = h * 0.45, r = 46;
  g.fillStyle = "#111";
  g.beginPath(); g.moveTo(cx, cy); g.arc(cx, cy, r, 0, Math.PI / 2); g.fill();
  g.beginPath(); g.moveTo(cx, cy); g.arc(cx, cy, r, Math.PI, Math.PI * 1.5); g.fill();
  g.lineWidth = 6; g.strokeStyle = "#111"; g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.stroke();
  g.font = "bold 22px sans-serif"; g.textAlign = "center"; g.fillText("TEST-07", cx, h * 0.86);
});
const dummyHeadTex = canvasTexture(256, 128, (g, w, h) => {
  g.fillStyle = "#e8b520"; g.fillRect(0, 0, w, h);
  const cx = w * 0.75, cy = h / 2, r = 22; // marker sits on the face (the -Z side of the sphere)
  g.fillStyle = "#111";
  g.beginPath(); g.moveTo(cx, cy); g.arc(cx, cy, r, 0, Math.PI / 2); g.fill();
  g.beginPath(); g.moveTo(cx, cy); g.arc(cx, cy, r, Math.PI, Math.PI * 1.5); g.fill();
  g.lineWidth = 4; g.strokeStyle = "#111"; g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.stroke();
});
const bloodTextures = [0, 1, 2, 3].map(() => canvasTexture(256, 256, (g, w, h) => {
  const cx = w / 2, cy = h / 2;
  const grad = g.createRadialGradient(cx, cy, 4, cx, cy, 90);
  // drawn in greys and tinted per fluid by the material colour (blood, robot oil)
  grad.addColorStop(0, "rgba(150,150,150,1)"); grad.addColorStop(0.6, "rgba(225,225,225,.95)"); grad.addColorStop(1, "rgba(240,240,240,0)");
  g.fillStyle = grad;
  g.beginPath(); g.arc(cx, cy, rand(40, 70), 0, Math.PI * 2); g.fill();
  for (let i = 0; i < 26; i++) {
    const a = rand(0, Math.PI * 2), d = rand(30, 110), r = rand(2, 14);
    const v = rand(170, 255) | 0;
    g.fillStyle = `rgba(${v},${v},${v},${rand(.7, 1)})`;
    g.beginPath(); g.arc(cx + Math.cos(a) * d, cy + Math.sin(a) * d, r, 0, Math.PI * 2); g.fill();
    if (Math.random() < .5) { // streaks
      g.strokeStyle = g.fillStyle; g.lineWidth = r * 0.7;
      g.beginPath(); g.moveTo(cx + Math.cos(a) * d * .5, cy + Math.sin(a) * d * .5); g.lineTo(cx + Math.cos(a) * d, cy + Math.sin(a) * d); g.stroke();
    }
  }
}));
const dripTex = canvasTexture(32, 256, (g, w, h) => {
  const grad = g.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, "rgba(220,220,220,.95)"); grad.addColorStop(0.85, "rgba(200,200,200,.85)"); grad.addColorStop(1, "rgba(200,200,200,0)");
  g.fillStyle = grad;
  g.beginPath(); g.moveTo(w * 0.3, 0); g.lineTo(w * 0.7, 0); g.lineTo(w * 0.56, h * 0.93); g.lineTo(w * 0.44, h * 0.93); g.fill();
  g.beginPath(); g.arc(w / 2, h * 0.93, w * 0.17, 0, Math.PI * 2); g.fill();
});
const holeTex = canvasTexture(64, 64, (g, w, h) => {
  const grad = g.createRadialGradient(32, 32, 2, 32, 32, 30);
  grad.addColorStop(0, "rgba(0,0,0,1)"); grad.addColorStop(.3, "rgba(15,15,15,.9)"); grad.addColorStop(1, "rgba(30,30,30,0)");
  g.fillStyle = grad; g.fillRect(0, 0, w, h);
});
const dotTex = canvasTexture(64, 64, (g, w, h) => {
  const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  grad.addColorStop(0, "rgba(255,255,255,1)"); grad.addColorStop(.5, "rgba(255,255,255,.7)"); grad.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = grad; g.fillRect(0, 0, w, h);
});
const flashTex = canvasTexture(128, 128, (g, w, h) => {
  g.translate(64, 64);
  for (let i = 0; i < 7; i++) {
    g.rotate(Math.PI * 2 / 7 + rand(-.2, .2));
    const grad = g.createLinearGradient(0, 0, 0, -60);
    grad.addColorStop(0, "rgba(255,240,200,1)"); grad.addColorStop(1, "rgba(255,140,30,0)");
    g.fillStyle = grad;
    g.beginPath(); g.moveTo(-7, 0); g.lineTo(0, -rand(40, 62)); g.lineTo(7, 0); g.fill();
  }
  const core = g.createRadialGradient(0, 0, 0, 0, 0, 26);
  core.addColorStop(0, "rgba(255,255,240,1)"); core.addColorStop(1, "rgba(255,170,60,0)");
  g.fillStyle = core; g.beginPath(); g.arc(0, 0, 26, 0, Math.PI * 2); g.fill();
});

// ---------------------------------------------------------------- physics world
const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -9.82, 0) });
world.broadphase = new CANNON.SAPBroadphase(world);
world.allowSleep = true;
world.solver.iterations = 14;
const groundMat = new CANNON.Material("ground");
const fleshMat = new CANNON.Material("flesh");
world.addContactMaterial(new CANNON.ContactMaterial(groundMat, fleshMat, { friction: 0.6, restitution: 0.05 }));
world.addContactMaterial(new CANNON.ContactMaterial(fleshMat, fleshMat, { friction: 0.4, restitution: 0.02 }));

// ---------------------------------------------------------------- the range
const ROOM = { minX: -8, maxX: 8, minZ: -16, maxZ: 9, h: 5 };
const worldMeshes = [];

function addStatic(mesh, shape, pos, quat) {
  mesh.position.copy(pos);
  if (quat) mesh.quaternion.copy(quat);
  mesh.receiveShadow = true;
  scene.add(mesh);
  worldMeshes.push(mesh);
  if (shape) {
    const body = new CANNON.Body({ mass: 0, material: groundMat, shape });
    body.position.copy(pos);
    if (quat) body.quaternion.copy(quat);
    world.addBody(body);
  }
  return mesh;
}
{
  const W = ROOM.maxX - ROOM.minX, D = ROOM.maxZ - ROOM.minZ;
  const floorMat = new THREE.MeshStandardMaterial({ map: concreteTex, roughness: 0.85, metalness: 0.05 });
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(W, D), floorMat);

// glossy splats, and on walls the bigger ones grow drips that run down
const drips = [];
function bloodSplat(point, normal, size, fl = FLUIDS.blood) {
  const m = addDecal(point, normal, size, bloodTextures[(Math.random() * 4) | 0], rand(0.8, 0.97), fl.decal);

      d.lookAt(d.position.clone().add(normal));

// blood on the camera when something bursts right in front of you
const screenBlood = document.getElementById("screenBlood");
const sbCtx = screenBlood.getContext("2d");
const screenDrops = [];
function screenSplatter(amount, fl = FLUIDS.blood) {
  const c = new THREE.Color(fl.decal);
  for (let i = 0; i < amount; i++) {
    screenDrops.push({ x: rand(0, 1), y: rand(0, 0.85), r: rand(6, 38) * (Math.random() < 0.15 ? 2.2 : 1), vy: rand(0.004, 0.03), life: rand(2.5, 5), age: 0,
      col: `${(c.r * 255) | 0},${(c.g * 255) | 0},${(c.b * 255) | 0}` });
  }
}
function drawScreenBlood(dt) {
  const w = screenBlood.width = innerWidth, h = screenBlood.height = innerHeight;
  sbCtx.clearRect(0, 0, w, h);
  for (let i = screenDrops.length - 1; i >= 0; i--) {
    const d = screenDrops[i];
    d.age += dt; d.y += d.vy * dt * (d.r / 20);
    const a = Math.max(0, 1 - d.age / d.life);
    if (a <= 0) { screenDrops.splice(i, 1); continue; }
    const x = d.x * w, y = d.y * h;
    // a thin tapered trail where the drop has run, then the drop itself as a few overlapping blobs
    const len = Math.min(h * 0.4, d.age * 34 * (d.r / 20));
    if (len > 2) {
      const tg = sbCtx.createLinearGradient(0, y - len, 0, y);
      tg.addColorStop(0, `rgba(${d.col},0)`); tg.addColorStop(1, `rgba(${d.col},${0.45 * a})`);
      sbCtx.fillStyle = tg;
      sbCtx.beginPath(); sbCtx.moveTo(x - d.r * 0.05, y - len); sbCtx.lineTo(x + d.r * 0.05, y - len); sbCtx.lineTo(x + d.r * 0.22, y); sbCtx.lineTo(x - d.r * 0.22, y); sbCtx.fill();
    }
    d.blobs = d.blobs || Array.from({ length: 3 }, () => [rand(-0.45, 0.45), rand(-0.45, 0.45), rand(0.45, 0.8)]);
    for (const [ox, oy, rr] of d.blobs) {
      const bx = x + ox * d.r, by = y + oy * d.r, br = d.r * rr;
      const g = sbCtx.createRadialGradient(bx - br * 0.35, by - br * 0.35, br * 0.05, bx, by, br);
      g.addColorStop(0, `rgba(${d.col},${0.35 * a})`); g.addColorStop(0.75, `rgba(${d.col},${0.8 * a})`); g.addColorStop(1, `rgba(${d.col},0)`);
      sbCtx.fillStyle = g;
      sbCtx.beginPath(); sbCtx.arc(bx, by, br, 0, Math.PI * 2); sbCtx.fill();
    }
  }
}

const dummies = [];
const partByMesh = new Map();
const dummyMeshes = [];

class Dummy {
  constructor(kind, x, z, yaw = 0) {
    const g = MODELS[kind];
    this.kind = kind;
    this.def = MODEL_DEFS[kind];
    this.fluid = FLUIDS[this.def.fluid];
    this.root = SkeletonUtils.clone(g.scene);
    this.root.scale.setScalar(this.def.scale);
    this.root.position.set(x, 0, z);
    this.root.rotation.y = yaw;
    this.prepare(this.root);
    scene.add(this.root);
    this.mixer = new THREE.AnimationMixer(this.root);
    const clip = g.animations.find(a => this.def.idle.test(a.name)) || g.animations[0];
    if (clip) this.mixer.clipAction(clip).play();
    this.mixer.update(Math.random() * 3);
    this.active = false; this.dead = false;
    this.parts = {}; this.joints = {}; this.bleeders = []; this.views = []; this.extra = [];
    dummies.push(this);
  }
  prepare(obj) {
    obj.traverse(o => {
      if (!o.isMesh) return;
      o.castShadow = true; o.receiveShadow = true; o.frustumCulled = false;
      if (o.isSkinnedMesh) { partByMesh.set(o, { dummy: this }); dummyMeshes.push(o); }

  // the first hit freezes the animated pose into physics bodies
  activate() {

    this.root.updateMatrixWorld(true);
    const bones = {};
    this.root.traverse(o => { if (o.isBone) bones[o.name] = o; });
    const wp = n => {
      const BN = this.def.bone;
      const o = BN(n) && (bones[BN(n)] || this.root.getObjectByName(BN(n)));
      if (o) return o.getWorldPosition(new THREE.Vector3());
      // some rigs have no head-tip marker: extend the neck-to-head line instead
      const head = bones[this.def.bone("Head")].getWorldPosition(new THREE.Vector3());
      const neck = bones[this.def.bone("Neck")].getWorldPosition(new THREE.Vector3());
      return head.clone().add(head.clone().sub(neck).normalize().multiplyScalar(0.22));
    };
    const right = new THREE.Vector3(1, 0, 0).applyQuaternion(this.root.quaternion);

      const a = wp(s.a), b = wp(s.b);
      const dir = b.clone().sub(a);
      let len = dir.length(); dir.normalize();
      if (s.ext) { b.addScaledVector(dir, s.ext); len += s.ext; }
      const x = right.clone().addScaledVector(dir, -right.dot(dir));
      if (x.lengthSq() < 1e-4) x.set(0, 0, 1).addScaledVector(dir, -dir.z);
      x.normalize();
      const z = new THREE.Vector3().crossVectors(x, dir);
      const q = new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(x, dir, z));
      const center = a.clone().add(b).multiplyScalar(0.5);
      const shape = s.r ? new CANNON.Sphere(s.r) : new CANNON.Box(new CANNON.Vec3(s.w[0], Math.max(len / 2, 0.05), s.w[1]));

      body.sleepSpeedLimit = 0.2; body.sleepTimeLimit = 0.8;
      body.addEventListener("collide", e => {
        const v = Math.abs(e.contact.getImpactVelocityAlongNormal());
        const t = performance.now();

          this.lastThud = t;
          const pos = toV3(body.position);
          if (this.def.fluid === "oil") Sound.metal(pos); else Sound.thud(pos, v);
          const part = Object.values(this.parts).find(p => p.body === body);
          if (part && part.wounds > 0 && e.body.mass === 0 && pos.y < 0.5) bloodSplat(new THREE.Vector3(pos.x, 0.002, pos.z), new THREE.Vector3(0, 1, 0), rand(0.2, 0.45), this.fluid);
        }
      });
      world.addBody(body);
      const group = new THREE.Group(); scene.add(group);
      this.parts[s.n] = { def: s, body, group, hp: s.hp, wounds: 0, attached: true, start: a, dir, half: len / 2 };
    }
    const local = (body, v) => body.quaternion.inverse().vmult(new CANNON.Vec3(v.x, v.y, v.z));
    for (const s of SEGS) {
      if (!s.p) continue;
      const A = this.parts[s.p].body, B = this.parts[s.n].body;
      const pivot = this.parts[s.n].start, dir = this.parts[s.n].dir;
      const c = new CANNON.ConeTwistConstraint(A, B, {
        pivotA: local(A, pivot.clone().sub(A.position)), pivotB: local(B, pivot.clone().sub(B.position)),
        axisA: local(A, dir), axisB: local(B, dir), angle: s.ang, twistAngle: s.tw, collideConnected: false,
      });
      world.addConstraint(c);
      this.joints[s.n] = c;
    }
    // every bone rides rigidly on the body of the nearest ragdoll bone above it
    this.offsets = {};
    for (const name in bones) {
      let b = bones[name];
      const seg = this.def.segByBone;
      while (b && !(b.isBone && seg[b.name])) b = b.parent;
      const owner = (this.def.owners && this.def.owners[name]) || (b ? seg[b.name] : "pelvis");
      const body = this.parts[owner].body;
      const bodyM = new THREE.Matrix4().compose(toV3(body.position), toQ(body.quaternion), ONE);
      this.offsets[name] = { owner, offset: bodyM.invert().multiply(bones[name].matrixWorld) };
    }
    this.views.push(this.makeView(this.root, null));
  }
  makeView(obj, pieceRoot) {
    const entries = [];
    obj.traverse(o => { if (o.isBone && this.offsets[o.name]) entries.push({ bone: o, ...this.offsets[o.name] }); });
    return { obj, pieceRoot, entries };
  }
  severedRoot(name) {
    for (let p = name; p; p = this.parts[p].def.p) if (!this.parts[p].attached) return p;
    return null;
  }
  isBelow(name, root) {
    for (let p = name; p; p = this.parts[p].def.p) if (p === root) return true;
    return false;
  }
  pivot(name, side) {
    const c = this.joints[name];
    const body = side === "A" ? this.parts[this.parts[name].def.p].body : this.parts[name].body;
    const w = body.quaternion.vmult(side === "A" ? c.pivotA : c.pivotB).vadd(body.position);
    return toV3(w);
  }
  nearestPart(point) {
    let best = "chest", bestD = Infinity;
    for (const k in this.parts) {
      const { body, half, def } = this.parts[k];
      const axis = new THREE.Vector3(0, 1, 0).applyQuaternion(toQ(body.quaternion));
      const rel = point.clone().sub(toV3(body.position));
      const t = THREE.MathUtils.clamp(rel.dot(axis), -half, half);
      let d = rel.addScaledVector(axis, -t).length() - (def.r || def.w[0]);
      if (k === "head") d -= 0.03;
      if (d < bestD) { bestD = d; best = k; }
    }
    return best;
  }
  sever(name) {
    const part = this.parts[name];
    if (!part.attached || !this.joints[name]) return;
    const at = this.pivot(name, "A");
    part.attached = false;
    world.removeConstraint(this.joints[name]);
    // the cut-off piece is a second copy of the same skinned mesh that only shows this limb
    const piece = SkeletonUtils.clone(MODELS[this.kind].scene);
    piece.scale.setScalar(this.def.scale);
    this.prepare(piece); scene.add(piece);
    this.views.push(this.makeView(piece, name));
    this.extra.push(piece);
    const parent = this.parts[part.def.p];
    const cap = (p, worldPoint, outward) => {
      p.group.updateMatrixWorld(true);
      const localPt = p.group.worldToLocal(worldPoint.clone());
      const r = name === "head" ? 0.06 : Math.max(p.def.r || p.def.w[0], 0.05);
      const disc = new THREE.Mesh(new THREE.CircleGeometry(r, 18), fleshMatVis);
      disc.position.copy(localPt); disc.lookAt(localPt.clone().add(outward)); p.group.add(disc);
      const bone = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.05, 8), boneMat);
      bone.position.copy(localPt).addScaledVector(outward, 0.015); bone.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), outward); p.group.add(bone);
      return localPt;
    };
    const c = this.joints[name];
    const outParent = toV3(c.axisA).normalize(), outPiece = toV3(c.axisB).normalize().negate();
    const stump = cap(parent, at, outParent);
    const end = cap(part, this.pivot(name, "B"), outPiece);
    this.bleeders.push({ part: parent, local: stump, dir: outParent, t: 0, dur: name === "head" ? 5 : 3.5, rate: name === "head" ? 340 : 220 });
    this.bleeders.push({ part, local: end, dir: outPiece, t: 0, dur: 2.2, rate: 140 });
    bloodBurst(at, new THREE.Vector3(0, 1, 0), 220, 3.8, 1.9, this.fluid);
    bloodMist(at, 1.8, this.fluid);
    for (let i = 0; i < 14; i++) spawnChunk(at, this.fluid);
    Sound.gore(at);
    if (at.distanceTo(camera.position) < 3.5) screenSplatter(18, this.fluid);
  }
  remove() {
    scene.remove(this.root);
    for (const e of this.extra) scene.remove(e);
    for (const k in this.parts) { world.removeBody(this.parts[k].body); scene.remove(this.parts[k].group); }
    for (const k in this.joints) world.removeConstraint(this.joints[k]);
    for (const [m, info] of [...partByMesh]) if (info.dummy === this) { partByMesh.delete(m); const i = dummyMeshes.indexOf(m); if (i >= 0) dummyMeshes.splice(i, 1); }
    dummies.splice(dummies.indexOf(this), 1);
  }
  update(dt) {
    if (!this.active) { this.mixer.update(dt); return; }
    for (const k in this.parts) {
      const { body, group } = this.parts[k];
      group.position.copy(body.position); group.quaternion.copy(body.quaternion);
    }
    for (let i = this.bleeders.length - 1; i >= 0; i--) {
      const b = this.bleeders[i];
      b.t += dt;
      if (b.t > b.dur) { this.bleeders.splice(i, 1); continue; }
      const strength = 1 - b.t / b.dur;
      b.part.group.updateMatrixWorld(true);
      const at = b.part.group.localToWorld(b.local.clone());
      const dir = b.dir.clone().applyQuaternion(b.part.group.quaternion);
      const n = Math.floor(b.rate * dt * strength + Math.random());
      for (let k = 0; k < n; k++) {
        const v = dir.clone().multiplyScalar(rand(1.2, 3.2) * (0.4 + strength * pulse(b.t)));
        v.x += rand(-.3, .3); v.y += rand(-.2, .4); v.z += rand(-.3, .3);
        spawnParticle(at, v, true, fluidDrop(this.fluid), rand(0.6, 1.6), Math.random() < 0.14 ? 1 : 0, rand(0.012, 0.04), this.fluid);
      }
    }
    for (const k in this.parts) {
      const p = this.parts[k];
      const speed = p.body.velocity.length();
      if (p.wounds > 0 && p.body.position.y < 0.3 && speed < 0.4 && Math.random() < dt * 1.5) {
        growPool(p.body.position.x + rand(-.1, .1), p.body.position.z + rand(-.1, .1), Math.min(1.6, 0.4 + p.wounds * 0.14), this.fluid);
      }
      // smeared trails where a bleeding part slides along the floor
      if (p.wounds > 0 && p.body.position.y < 0.35 && speed > 0.7 && Math.random() < dt * 14) {
        bloodSplat(new THREE.Vector3(p.body.position.x, 0.002, p.body.position.z), new THREE.Vector3(0, 1, 0), rand(0.12, 0.3), this.fluid);
      }
    }
  }
  // after the scene's matrices are updated: drive every bone of every view from the physics bodies
  pose() {
    if (!this.active) return;
    const bodyM = {};
    for (const k in this.parts) bodyM[k] = new THREE.Matrix4().compose(toV3(this.parts[k].body.position), toQ(this.parts[k].body.quaternion), ONE);
    for (const view of this.views) {
      for (const e of view.entries) {
        const sr = this.severedRoot(e.owner);
        const visible = view.pieceRoot ? sr === view.pieceRoot : sr === null;
        const gone = view.pieceRoot && this.exploded && this.exploded.has(view.pieceRoot);
        if (visible && !gone) { e.bone.matrixWorld.multiplyMatrices(bodyM[e.owner], e.offset); continue; }
        let cut;
        if (!view.pieceRoot) cut = this.pivot(sr, "A");
        else if (sr && sr !== view.pieceRoot && this.isBelow(sr, view.pieceRoot)) cut = this.pivot(sr, "A");
        else cut = this.pivot(view.pieceRoot, "B");
        e.bone.matrixWorld.compose(cut, new THREE.Quaternion(), TINY);
      }
    }
  }
}

const pulse = t => 0.65 + 0.35 * Math.max(0, Math.sin(t * 9)); // arterial spurts

// gore chunks: little lumps of flesh that bounce and leave a smear
const chunks = [];
// lumpy flesh, bone shards and darker organ bits; robots shed bolts and plates instead
function lumpy(radius, detail) {
  const g = new THREE.IcosahedronGeometry(radius, detail);
  const pos = g.attributes.position;
  for (let i = 0; i < pos.count; i++) pos.setXYZ(i, pos.getX(i) * rand(0.7, 1.3), pos.getY(i) * rand(0.6, 1.2), pos.getZ(i) * rand(0.7, 1.3));
  g.computeVertexNormals();
  return g;
}
const GIB_GEOS = [lumpy(0.03, 1), lumpy(0.022, 1), lumpy(0.04, 1)];
const SHARD_GEO = new THREE.BoxGeometry(0.012, 0.06, 0.014);
const organMat = new THREE.MeshStandardMaterial({ color: 0x3a0812, roughness: 0.25, metalness: 0.1 });
const plateMat = new THREE.MeshStandardMaterial({ color: 0x8a8f96, roughness: 0.4, metalness: 0.9 });
function spawnChunk(at, fl = FLUIDS.blood, power = 1) {
  const roll = Math.random();
  let m;
  if (fl.sparks) m = new THREE.Mesh(roll < 0.5 ? SHARD_GEO : GIB_GEOS[0], plateMat);
  else if (roll < 0.15) m = new THREE.Mesh(SHARD_GEO, boneMat);
  else m = new THREE.Mesh(GIB_GEOS[(Math.random() * 3) | 0], roll < 0.35 ? organMat : fleshMatVis);
  m.position.copy(at); m.scale.setScalar(rand(0.6, 1.7)); m.castShadow = true;
  m.userData = { v: new THREE.Vector3(rand(-2.8, 2.8), rand(1.5, 5), rand(-2.8, 2.8)).multiplyScalar(power), spin: new THREE.Vector3(rand(-12, 12), rand(-12, 12), rand(-12, 12)), rest: false, life: 25, fl, bounced: false };
  scene.add(m); chunks.push(m);
  if (chunks.length > 180) scene.remove(chunks.shift());
}

const gunMetal = new THREE.MeshStandardMaterial({ color: 0x2b2e33, metalness: 0.95, roughness: 0.32 });
const gunPolymer = new THREE.MeshStandardMaterial({ color: 0x17181b, metalness: 0.2, roughness: 0.7 });
const gunAccent = new THREE.MeshStandardMaterial({ color: 0x6b5a3c, metalness: 0.3, roughness: 0.6 });
const brassMat = new THREE.MeshStandardMaterial({ color: 0xc9a046, metalness: 1, roughness: 0.25 });

function box(parent, size, pos, mat, rot) {
  const m = new THREE.Mesh(new RoundedBoxGeometry(size[0], size[1], size[2], 2, Math.min(...size) * 0.18), mat);
  m.position.set(...pos); if (rot) m.rotation.set(...rot);
  m.castShadow = true; parent.add(m); return m;
}
function cyl(parent, r, len, pos, mat, axis = "z", seg = 20) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, seg), mat);
  m.position.set(...pos);
  if (axis === "z") m.rotation.x = Math.PI / 2; else if (axis === "x") m.rotation.z = Math.PI / 2;
  parent.add(m); return m;
}

function buildPistol() {
  const g = new THREE.Group();
  const slide = new THREE.Group(); g.add(slide);
  box(slide, [0.03, 0.033, 0.19], [0, 0.03, 0], gunMetal);
  for (let i = 0; i < 7; i++) box(slide, [0.031, 0.024, 0.003], [0, 0.031, 0.06 + i * 0.006], gunPolymer); // serrations
  box(slide, [0.006, 0.008, 0.008], [0, 0.05, -0.088], gunPolymer); // front sight
  box(slide, [0.022, 0.008, 0.008], [0, 0.05, 0.085], gunPolymer); // rear sight
  box(slide, [0.012, 0.012, 0.03], [0.012, 0.03, -0.01], gunPolymer); // ejection port
  cyl(g, 0.0075, 0.03, [0, 0.03, -0.1], gunMetal);
  box(g, [0.028, 0.026, 0.17], [0, 0.003, 0.005], gunPolymer); // frame
  box(g, [0.028, 0.008, 0.04], [0, -0.008, -0.06], gunPolymer); // rail
  const grip = box(g, [0.03, 0.115, 0.052], [0, -0.06, 0.058], gunPolymer, [-0.22, 0, 0]);
  for (let i = 0; i < 5; i++) box(grip, [0.031, 0.003, 0.05], [0, -0.04 + i * 0.018, 0], gunAccent); // grip texture
  const guard = new THREE.Mesh(new THREE.TorusGeometry(0.02, 0.0035, 8, 20, Math.PI), gunPolymer);
  guard.rotation.set(0, Math.PI / 2, Math.PI); guard.position.set(0, -0.012, 0.01); g.add(guard);
  box(g, [0.006, 0.02, 0.006], [0, -0.016, 0.012], gunMetal, [0.3, 0, 0]); // trigger
  const mag = new THREE.Group(); mag.position.set(0, -0.06, 0.058); mag.rotation.x = -0.22; g.add(mag);
  box(mag, [0.024, 0.11, 0.04], [0, -0.004, 0], gunMetal);
  box(mag, [0.03, 0.012, 0.05], [0, -0.062, 0], gunPolymer);
  const muzzle = new THREE.Object3D(); muzzle.position.set(0, 0.03, -0.12); g.add(muzzle);
  const port = new THREE.Object3D(); port.position.set(0.02, 0.04, -0.01); g.add(port);
  return { root: g, slide, mag, muzzle, port };
}

function buildRifle() {
  const g = new THREE.Group();
  const bolt = new THREE.Group(); g.add(bolt);
  box(g, [0.045, 0.06, 0.34], [0, 0.0, 0.0], gunMetal); // receiver
  box(g, [0.05, 0.05, 0.28], [0, 0.002, -0.3], gunPolymer); // handguard
  for (let i = 0; i < 12; i++) box(g, [0.016, 0.006, 0.012], [0, 0.03, -0.43 + i * 0.022], gunMetal); // top rail
  for (let i = 0; i < 6; i++) for (const s of [-1, 1]) box(g, [0.004, 0.022, 0.03], [s * 0.026, 0.002, -0.4 + i * 0.045], gunMetal);
  cyl(g, 0.009, 0.24, [0, 0.005, -0.55], gunMetal);
  cyl(g, 0.016, 0.06, [0, 0.005, -0.68], gunMetal, "z", 6); // muzzle brake

  box(g, [0.04, 0.07, 0.24], [0, -0.01, 0.33], gunPolymer); // stock

  guard.rotation.set(0, Math.PI / 2, Math.PI); guard.position.set(0, -0.03, 0.09); g.add(guard);
  // red dot sight
  const sight = new THREE.Group(); sight.position.set(0, 0.062, -0.02); g.add(sight);
  box(sight, [0.03, 0.012, 0.06], [0, -0.012, 0], gunMetal);
  const housing = new THREE.Mesh(new THREE.CylinderGeometry(0.019, 0.019, 0.05, 24, 1, true), gunPolymer);
  housing.rotation.x = Math.PI / 2; housing.material = housing.material.clone(); housing.material.side = THREE.DoubleSide; sight.add(housing);
  const glass = new THREE.Mesh(new THREE.CircleGeometry(0.018, 24), new THREE.MeshStandardMaterial({ color: 0x88aacc, transparent: true, opacity: 0.18, metalness: 1, roughness: 0 }));
  glass.position.z = -0.01; sight.add(glass);
  const dot = new THREE.Mesh(new THREE.CircleGeometry(0.0014, 12), sightDot); dot.position.z = -0.011; dot.rotation.y = Math.PI; sight.add(dot);
  const mag = new THREE.Group(); mag.position.set(0, -0.07, -0.06); g.add(mag);
  box(mag, [0.03, 0.08, 0.06], [0, 0, 0], gunMetal, [0.12, 0, 0]);
  box(mag, [0.03, 0.07, 0.058], [0, -0.065, -0.012], gunMetal, [0.32, 0, 0]);
  const muzzle = new THREE.Object3D(); muzzle.position.set(0, 0.005, -0.72); g.add(muzzle);
  const port = new THREE.Object3D(); port.position.set(0.03, 0.01, 0.0); g.add(port);
  return { root: g, slide: bolt, mag, muzzle, port };
}

function buildShotgun() {

document.addEventListener("mousedown", e => { if (!locked) return; if (e.button === 0) { mouseDown = true; tryShoot(); } if (e.button === 2) aiming = true; });
document.addEventListener("mouseup", e => { if (e.button === 0) mouseDown = false; if (e.button === 2) aiming = false; });
document.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("keydown", e => {
  keys[e.code] = true;
  if (!locked) return;
  if (e.code === "KeyR") startReload();
  if (e.code === "Digit1") switchWeapon("pistol");
  if (e.code === "Digit2") switchWeapon("rifle");
  if (e.code === "Digit3") switchWeapon("shotgun");
  if (e.code === "KeyT") { spawnKind = (spawnKind + 1) % SPAWN_KINDS.length; feed(MODEL_DEFS[SPAWN_KINDS[spawnKind]].label.toUpperCase()); }
  if (e.code === "KeyE") spawnDummyInFront();
  if (e.code === "KeyC") cleanUp();
  if (e.code === "KeyQ") { slowmo = !slowmo; document.getElementById("slowmo").style.opacity = slowmo ? 1 : 0; }
  if (e.code === "Space" && player.onGround) { player.vel.y = 4.6; player.onGround = false; }
});
document.addEventListener("keyup", e => { keys[e.code] = false; });

// ---------------------------------------------------------------- gun state and animation
const gs = { cooldown: 0, reloading: false, reloadT: 0, switchT: 0, kick: 0, kickV: 0, slide: 0, swayX: 0, swayY: 0, bob: 0, ads: 0, spread: 0, magDropped: false };
const raycaster = new THREE.Raycaster();
let shotHit = false, shotsFired = 0, hits = 0, headshots = 0, severed = 0;

function switchWeapon(k) {
  if (current === guns[k] || gs.reloading) return;
  current.root.visible = false;
  current = guns[k];
  current.root.visible = true;
  gs.switchT = 0.35;
  updateAmmoUI();
}

function startReload() {
  if (gs.reloading || current.ammo === current.def.mag || gs.switchT > 0) return;
  gs.reloading = true; gs.reloadT = 0; gs.magDropped = false; gs.magIn = false; gs.racked = false;
  document.getElementById("reloadText").textContent = "RELOADING";
}

function tryShoot() {
  if (!locked || gs.cooldown > 0 || gs.reloading || gs.switchT > 0) return;
  if (current.ammo <= 0) { Sound.dry(); gs.cooldown = 0.25; startReload(); return; }
  current.ammo--; gs.cooldown = current.def.rate; shotsFired++;
  updateAmmoUI();
  // recoil
  gs.kickV += current.def.kick * 60;
  gs.slide = 1;
  player.recoil += current.def.kick * (aiming ? 0.6 : 1);
  player.recoilYaw += rand(-1, 1) * current.def.kick * 0.35;
  gs.spread = Math.min(0.05, gs.spread + current.def.spread * 1.8);
  // muzzle flash
  current.muzzle.getWorldPosition(flash.position);
  flash.scale.setScalar(rand(0.14, 0.22)); flash.material.rotation = rand(0, Math.PI * 2);
  flash.visible = true; flash.userData.t = 0.045;
  gunLight.intensity = current.def.pellets ? 10 : 6;
  if (current.def.pellets) { flash.scale.multiplyScalar(1.6); setTimeout(ejectShell, current.def.pumpDelay * 1000); gs.pumpAt = current.def.pumpDelay; }
  else ejectShell();
  Sound.shot(current === guns.shotgun ? "shotgun" : current === guns.rifle ? "rifle" : "pistol");
  // the bullet (or a spread of pellets)
  const origin = camera.getWorldPosition(new THREE.Vector3());
  for (const m of dummyMeshes) { m.boundingSphere = null; m.boundingBox = null; }
  const n = current.def.pellets || 1;
  shotHit = false;
  for (let i = 0; i < n; i++) {
    const spread = (aiming ? (n > 1 ? 0.7 : 0.25) : 1) * (current.def.spread + gs.spread);
    const dir = new THREE.Vector3(rand(-spread, spread), rand(-spread, spread), -1).normalize().applyQuaternion(camera.quaternion);
    raycaster.set(origin, dir); raycaster.far = 80;
    const hit = raycaster.intersectObjects([...dummyMeshes, ...worldMeshes], false)[0];
    tracer(origin, dir, hit ? hit.distance : 60);
    if (!hit) continue;
    const info = partByMesh.get(hit.object);
    if (info) hitDummy(info, hit, dir, i > 0);
    else hitWorld(hit, i > 0);
  }
  if (shotHit) hits++; // a shotgun blast counts once, however many pellets land
}

function hitWorld(hit, quiet) {
  const n = hit.face.normal.clone().transformDirection(hit.object.matrixWorld);
  addDecal(hit.point, n, rand(0.05, 0.07), holeTex, 0.95);
  dustBurst(hit.point, n, quiet ? 5 : 12);
  if (!quiet) Sound.ricochet(hit.point);
}

function hitDummy(info, hit, dir, quiet) {
  const { dummy } = info;
  dummy.activate();
  const name = dummy.nearestPart(hit.point);
  const part = dummy.parts[name];
  shotHit = true;
  const head = name === "head";
  const dmg = current.def.damage * (head ? 2.2 : 1) * rand(0.9, 1.1);
  part.hp -= dmg; part.wounds++;
  // push the body
  const b = part.body;
  const imp = new CANNON.Vec3(dir.x, dir.y, dir.z).scale(current.def.punch * (head ? 0.7 : 1));
  b.applyImpulse(imp, new CANNON.Vec3(hit.point.x - b.position.x, hit.point.y - b.position.y, hit.point.z - b.position.z));
  // wound decal on the part
  const n = hit.face.normal.clone().transformDirection(hit.object.matrixWorld);
  const fl = dummy.fluid;
  const wound = new THREE.Mesh(new THREE.CircleGeometry(rand(0.022, 0.034), 14), new THREE.MeshStandardMaterial({ map: bloodTextures[(Math.random() * 4) | 0], color: fl.wound, transparent: true, roughness: 0.1, metalness: 0.1, polygonOffset: true, polygonOffsetFactor: -2 }));
  part.group.updateMatrixWorld(true);
  const local = part.group.worldToLocal(hit.point.clone().addScaledVector(n, 0.003));
  wound.position.copy(local);
  wound.lookAt(part.group.worldToLocal(hit.point.clone().add(n)));
  part.group.add(wound);
  // entry spray back toward the shooter, exit spray out the back
  const scale = quiet ? 0.45 : 1;
  bloodBurst(hit.point, n, (head ? 110 : 60) * scale, 2.4, 0.9, fl);
  bloodBurst(hit.point, dir, (head ? 160 : 90) * scale, 6, 0.8, fl);
  bloodMist(hit.point, head ? 1.5 : 0.9, fl);
  dummy.bleeders.push({ part, local: local.clone(), dir: local.clone().normalize(), t: 0, dur: 2.5, rate: 30 });
  dummy.bleeders.push({ part, local: local.clone(), dir: new THREE.Vector3(0, -1, 0), t: 0, dur: 9, rate: 7 }); // slow drip
  if (!quiet) { if (fl.sparks) Sound.metal(hit.point); else if (head) Sound.crunch(hit.point); else Sound.flesh(hit.point); }
  if (hit.distance < 2.5 && !quiet) screenSplatter(head ? 9 : 4, fl);
  // splatter the wall or floor behind
  raycaster.set(hit.point, dir); raycaster.far = 4;
  const behind = raycaster.intersectObjects(worldMeshes, false)[0];
  if (behind) {
    const bn = behind.face.normal.clone().transformDirection(behind.object.matrixWorld);
    bloodSplat(behind.point, bn, rand(0.4, 0.8) * (head ? 1.6 : 1) * (quiet ? 0.6 : 1), fl);
  }
  showHit(head);
  if (head) { headshots++; feed(part.hp <= 0 ? "HEADSHOT" : "HEAD"); }
  if (part.hp <= 0 && dummy.joints[name] && part.attached) {
    // a big enough overkill to the head bursts it instead of knocking it off
    const burst = head && part.hp < -45;
    dummy.sever(name); severed++;
    if (burst) {
      dummy.exploded = dummy.exploded || new Set(); dummy.exploded.add("head");
      const at = toV3(part.body.position);
      bloodBurst(at, dir, 420, 6, 2.6, fl); bloodBurst(at, new THREE.Vector3(0, 1, 0), 200, 3, 2.2, fl);
      bloodMist(at, 2.8, fl); bloodMist(at, 1.8, fl);
      for (let i = 0; i < 30; i++) spawnChunk(at, fl, 1.5);
      raycaster.set(at, dir); raycaster.far = 6;
      const wall = raycaster.intersectObjects(worldMeshes, false)[0];
      if (wall) bloodSplat(wall.point, wall.face.normal.clone().transformDirection(wall.object.matrixWorld), rand(1.0, 1.6), fl);
      if (at.distanceTo(camera.position) < 4) screenSplatter(30, fl);
      world.removeBody(part.body);
      feed("HEAD EXPLODED");
    } else if (head) feed("DECAPITATED");
    else feed("DISMEMBERED");
  }
  // torso destroyed: the whole dummy comes apart at every joint
  if ((name === "chest" || name === "pelvis") && part.hp <= -120 && !dummy.dead) {
    dummy.dead = true;
    for (const k of ["head", "uArmL", "uArmR", "uLegL", "uLegR"]) if (dummy.parts[k].attached) { dummy.sever(k); severed++; }
    for (let i = 0; i < 40; i++) spawnChunk(hit.point, fl, 1.4);
    bloodBurst(hit.point, new THREE.Vector3(0, 1, 0), 400, 4, 2.5, fl);
    feed("OBLITERATED");
  }
}

// bullet tracers
const tracers = [];
function tracer(origin, dir, dist) {
  const start = new THREE.Vector3(); current.muzzle.getWorldPosition(start);
  const end = origin.clone().addScaledVector(dir, dist);
  const geo = new THREE.BufferGeometry().setFromPoints([start, end]);
  const line = new THREE.Line(geo, new THREE.LineBasicMaterial({ color: 0xffd9a0, transparent: true, opacity: 0.55 }));
  line.userData.t = 0.06; scene.add(line); tracers.push(line);
}

// ---------------------------------------------------------------- UI
const ammoEl = document.getElementById("ammoCount"), nameEl = document.getElementById("weaponName");
function updateAmmoUI() { ammoEl.innerHTML = `${current.ammo}<small> / ${current.def.mag}</small>`; nameEl.textContent = current.def.name; }
const hm = document.getElementById("hitmarker");
let hmT = 0;
function showHit(head) { hm.className = head ? "head" : ""; hm.style.opacity = 1; hmT = 0.15; }
const feedEl = document.getElementById("feed");
let feedT = 0;
function feed(text) { feedEl.textContent = text; feedEl.classList.add("show"); feedT = 1.1; }
const statsEl = document.getElementById("stats");

// ---------------------------------------------------------------- spawning
function spawnDummyInFront() {
  const fwd = new THREE.Vector3(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
  const p = player.pos.clone().addScaledVector(fwd, 4);
  p.x = Math.max(ROOM.minX + 1, Math.min(ROOM.maxX - 1, p.x));
  p.z = Math.max(ROOM.minZ + 1, Math.min(ROOM.maxZ - 1, p.z));
  new Dummy(nextKind(), p.x, p.z, player.yaw); // facing the player
  if (dummies.length > 8) dummies[0].remove();
}
function cleanUp() {
  while (dummies.length) dummies[0].remove();
  for (const d of decals) { scene.remove(d); d.geometry.dispose(); d.material.dispose(); }
  decals.length = 0; pools.length = 0;
  for (const c of chunks) scene.remove(c); chunks.length = 0;
  for (const d of drips) { scene.remove(d); d.geometry.dispose(); d.material.dispose(); } drips.length = 0; screenDrops.length = 0;
  for (const s of shells) scene.remove(s); shells.length = 0;
  for (const m of droppedMags) scene.remove(m); droppedMags.length = 0;
  for (const p of P) p.alive = false;
  spawnStart();
}
const SPAWN_KINDS = ["soldier", "xbot", "michelle", "robot"];
let spawnKind = 0;
function nextKind() { return MODELS[SPAWN_KINDS[spawnKind]] ? SPAWN_KINDS[spawnKind] : "soldier"; }
function spawnStart() {
  const lineup = [["soldier", -2.4, -3.5], ["xbot", -0.8, -3.5], ["michelle", 0.8, -3.5], ["robot", 2.4, -3.5], ["soldier", 0, -8]];
  for (const [k, x, z] of lineup) if (MODELS[k]) new Dummy(k, x, z, 0);
}
const loadingEl = document.getElementById("loading");
if (location.protocol === "file:") {
  loadingEl.textContent = "Open this through the local server: double-click start.bat (Windows) or run start.sh";
} else {
  loadModels().then(() => { spawnStart(); loadingEl.textContent = ""; }).catch(e => { loadingEl.textContent = "Couldn't load the models: " + e.message; });
}

// ---------------------------------------------------------------- main loop
const clock = new THREE.Clock();
const tmpV = new THREE.Vector3();
function step() {
  requestAnimationFrame(step);
  const realDt = Math.min(clock.getDelta(), 0.05);
  const dt = realDt * (slowmo ? 0.25 : 1);

  // player movement
  const fwd = new THREE.Vector3(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
  const right = new THREE.Vector3(-fwd.z, 0, fwd.x);
  const wish = new THREE.Vector3();
  if (keys.KeyW) wish.add(fwd); if (keys.KeyS) wish.sub(fwd);
  if (keys.KeyD) wish.add(right); if (keys.KeyA) wish.sub(right);
  const sprint = keys.ShiftLeft && !aiming;
  const speed = aiming ? 2.2 : sprint ? 6.5 : 4.2;
  if (wish.lengthSq() > 0) wish.normalize().multiplyScalar(speed);
  const k = 1 - Math.exp(-realDt * (player.onGround ? 12 : 2));
  player.vel.x += (wish.x - player.vel.x) * k;
  player.vel.z += (wish.z - player.vel.z) * k;
  player.vel.y -= 12 * realDt;
  player.pos.addScaledVector(player.vel, realDt);
  if (player.pos.y <= 0) { player.pos.y = 0; player.vel.y = 0; player.onGround = true; }
  player.pos.x = Math.max(ROOM.minX + 0.4, Math.min(ROOM.maxX - 0.4, player.pos.x));
  player.pos.z = Math.max(ROOM.minZ + 0.4, Math.min(ROOM.maxZ - 0.4, player.pos.z));
  if (player.pos.z > 1.15 && player.pos.z < 2.05 && Math.abs(player.pos.x) < 2.5) player.pos.z = player.pos.z < 1.6 ? 1.15 : 2.05; // bench

  // camera with recoil recovery
  player.recoil *= Math.exp(-realDt * 9); player.recoilYaw *= Math.exp(-realDt * 9);
  camera.position.set(player.pos.x, player.pos.y + 1.62, player.pos.z);
  camera.rotation.set(player.pitch + player.recoil, player.yaw + player.recoilYaw, 0);
  camera.fov += ((aiming ? 52 : 72) - camera.fov) * (1 - Math.exp(-realDt * 14));
  camera.updateProjectionMatrix();

  // shooting
  gs.cooldown -= realDt;
  if (mouseDown && current.def.auto) tryShoot();
  gs.spread *= Math.exp(-realDt * 6);

  // gun animation: ADS blend, sway, bob, recoil spring, slide, reload, weapon switch
  gs.ads += ((aiming && !gs.reloading ? 1 : 0) - gs.ads) * (1 - Math.exp(-realDt * 16));
  gs.swayX += (-input.dx * 0.00025 - gs.swayX) * (1 - Math.exp(-realDt * 10));
  gs.swayY += (input.dy * 0.00025 - gs.swayY) * (1 - Math.exp(-realDt * 10));
  input.dx = 0; input.dy = 0;
  const moving = Math.hypot(player.vel.x, player.vel.z);
  gs.bob += realDt * moving * (sprint ? 1.9 : 1.6);
  gs.kickV += (-gs.kick * 420 - gs.kickV * 26) * realDt;
  gs.kick += gs.kickV * realDt;
  if (gs.pumpAt !== undefined && gs.pumpAt > -0.3) { gs.pumpAt -= realDt; if (current === guns.shotgun) gs.slide = gs.pumpAt < 0 ? Math.sin(Math.min(1, -gs.pumpAt / 0.3) * Math.PI) : 0; if (gs.pumpAt < 0 && !gs.pumpSound) { gs.pumpSound = true; Sound.rack(); } }
  else { gs.pumpSound = false; gs.slide = Math.max(0, gs.slide - realDt * 14); }
  const d = current.def;
  const base = d.hip.clone().lerp(d.ads, gs.ads);
  const bobAmt = (1 - gs.ads * 0.85) * Math.min(1, moving / 4);
  const pos = base.clone();
  pos.x += Math.cos(gs.bob) * 0.012 * bobAmt + gs.swayX * (1 - gs.ads * 0.7);
  pos.y += Math.abs(Math.sin(gs.bob)) * 0.014 * bobAmt + gs.swayY * (1 - gs.ads * 0.7) - (sprint ? 0.03 : 0);
  pos.z += gs.kick * 0.9;
  let rx = gs.kick * 3.2, ry = gs.swayX * 2, rz = gs.swayX * 3 + (sprint ? 0.35 : 0);
  // reload choreography
  if (gs.reloading) {
    gs.reloadT += realDt;
    const t = gs.reloadT / d.reload;
    const tilt = Math.sin(Math.min(1, t * 1.25) * Math.PI);
    rz += tilt * 0.55; rx += tilt * 0.25; pos.y -= tilt * 0.04;
    const mag = current.mag;
    if (t < 0.25) {
      mag.position.copy(current.magHome).y -= (t / 0.25) * 0.14;
      mag.visible = true;
    } else if (t < 0.55) {
      if (!gs.magDropped) {
        gs.magDropped = true;
        Sound.magOut();
        const drop = mag.clone(); mag.getWorldPosition(drop.position); mag.getWorldQuaternion(drop.quaternion);
        drop.scale.setScalar(1);
        drop.userData = { v: new THREE.Vector3(0, -1, 0).add(player.vel), spin: new THREE.Vector3(rand(-6, 6), rand(-3, 3), rand(-6, 6)), life: 20 };
        scene.add(drop); droppedMags.push(drop);
        if (droppedMags.length > 12) scene.remove(droppedMags.shift());
      }
      mag.visible = false;
    } else if (t < 0.8) {
      if (!gs.magIn && t > 0.72) { gs.magIn = true; Sound.magIn(); }
      mag.visible = true;
      mag.position.copy(current.magHome).y -= (1 - (t - 0.55) / 0.25) * 0.14;
    } else {
      mag.position.copy(current.magHome);
      if (!gs.racked) { gs.racked = true; Sound.rack(); }
      gs.slide = Math.max(gs.slide, Math.sin((t - 0.8) / 0.2 * Math.PI)); // rack the slide
    }
    if (t >= 1) {
      gs.reloading = false; current.ammo = d.mag; mag.position.copy(current.magHome); mag.visible = true;
      document.getElementById("reloadText").textContent = ""; updateAmmoUI();
    }
  }
  if (gs.switchT > 0) { gs.switchT -= realDt; pos.y -= gs.switchT * 0.6; rx -= gs.switchT * 2; }
  current.slide.position.z = gs.slide * d.slideKick;
  current.root.position.copy(pos);
  current.root.rotation.set(rx, ry, rz);

  // crosshair spread
  const gap = 6 + (gs.spread * 900 + moving * 2) * (1 - gs.ads);
  document.getElementById("ch-t").style.top = `${-gap - 9}px`;
  document.getElementById("ch-b").style.top = `${gap}px`;
  document.getElementById("ch-l").style.left = `${-gap - 9}px`;
  document.getElementById("ch-r").style.left = `${gap}px`;
  document.getElementById("crosshair").style.opacity = 1 - gs.ads;

  // flash and lights
  if (flash.visible) { flash.userData.t -= realDt; current.muzzle.getWorldPosition(flash.position); if (flash.userData.t <= 0) flash.visible = false; }
  gunLight.intensity *= Math.exp(-realDt * 40);

  // physics
  world.step(1 / 120, dt, 6);
  for (const dm of dummies) dm.update(dt);

  // blood particles
  for (let i = 0; i < MAX_P; i++) {
    const p = P[i];
    if (!p.alive) { pPos[i * 3 + 1] = -99; continue; }
    p.life -= dt;
    p.vy -= 9.8 * dt;
    if (!p.blood) { p.vx *= 0.97; p.vz *= 0.97; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
    let hitN = null;
    if (p.y <= 0.002) { hitN = tmpV.set(0, 1, 0); p.y = 0.002; }
    else if (p.z <= ROOM.minZ) { hitN = tmpV.set(0, 0, 1); p.z = ROOM.minZ + 0.002; }
    else if (p.x <= ROOM.minX) { hitN = tmpV.set(1, 0, 0); p.x = ROOM.minX + 0.002; }
    else if (p.x >= ROOM.maxX) { hitN = tmpV.set(-1, 0, 0); p.x = ROOM.maxX - 0.002; }
    if (hitN) {
      if (p.blood && (p.splat || Math.random() < 0.08)) bloodSplat(new THREE.Vector3(p.x, p.y, p.z), hitN.clone(), rand(0.06, 0.22) * (p.s > 0.035 ? 1.6 : 1), p.fl || FLUIDS.blood);
      p.alive = false;
    }
    if (p.life <= 0) p.alive = false;
    pPos[i * 3] = p.x; pPos[i * 3 + 1] = p.alive ? p.y : -99; pPos[i * 3 + 2] = p.z;
    pCol[i * 3] = p.r; pCol[i * 3 + 1] = p.g; pCol[i * 3 + 2] = p.b;
    pSize[i] = p.s;
  }
  pGeo.attributes.position.needsUpdate = true; pGeo.attributes.color.needsUpdate = true; pGeo.attributes.size.needsUpdate = true;
  pMat.uniforms.uScale.value = renderer.domElement.height / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2));
  for (const d of drips) if (d.scale.y < d.userData.len) d.scale.y = Math.min(d.userData.len, d.scale.y + d.userData.speed * dt * (1.2 - d.scale.y / d.userData.len));
  drawScreenBlood(realDt);
  Sound.listener(camera);
  // footsteps
  if (player.onGround && moving > 0.5) {
    gs.stepT = (gs.stepT || 0) - realDt * moving;
    if (gs.stepT <= 0) { gs.stepT = 1.7; Sound.step(sprint ? 0.18 : 0.12); }
  }

  // mist, pools, chunks, shells, mags, tracers
  for (let i = mists.length - 1; i >= 0; i--) {
    const s = mists[i]; s.userData.t += dt;
    const t = s.userData.t / 0.6;
    s.scale.setScalar(s.userData.size * (0.4 + t * 0.8)); s.material.opacity = 0.8 * (1 - t);
    if (t >= 1) { scene.remove(s); s.material.dispose(); mists.splice(i, 1); }
  }
  for (const pl of pools) if (pl.size < pl.max) { pl.size = Math.min(pl.max, pl.size + dt * 0.08); pl.mesh.scale.setScalar(pl.size); }
  const physicsLite = (arr, bounce, radius) => {
    for (const m of arr) {
      const u = m.userData;
      if (u.rest) continue;
      // flying gibs trail droplets
      if (arr === chunks && Math.random() < 0.5) spawnParticle(m.position, new THREE.Vector3(rand(-.3, .3), 0, rand(-.3, .3)), true, fluidDrop(u.fl || FLUIDS.blood), 0.8, 0, rand(0.008, 0.016), u.fl);
      u.v.y -= 9.8 * dt;
      m.position.addScaledVector(u.v, dt);

          else if (arr === droppedMags) Sound.magFloor(m.position);
          else if (arr === chunks) { Sound.splat(m.position, 0.12); if (!u.bounced) { u.bounced = true; bloodSplat(m.position.clone().setY(0.001), new THREE.Vector3(0, 1, 0), rand(0.1, 0.22), u.fl || FLUIDS.blood); } }
        }
        if (Math.abs(u.v.y) < 0.6) u.rest = true;
        u.v.y = -u.v.y * bounce; u.v.x *= 0.6; u.v.z *= 0.6; u.spin.multiplyScalar(0.5);
      }
      m.position.x = Math.max(ROOM.minX, Math.min(ROOM.maxX, m.position.x));
      m.position.z = Math.max(ROOM.minZ, Math.min(ROOM.maxZ, m.position.z));
    }
  };
  physicsLite(chunks, 0.2, 0.015); physicsLite(shells, 0.45, 0.005); physicsLite(droppedMags, 0.25, 0.02);
  for (let i = tracers.length - 1; i >= 0; i--) {
    const l = tracers[i]; l.userData.t -= realDt; l.material.opacity = Math.max(0, l.userData.t / 0.06) * 0.55;
    if (l.userData.t <= 0) { scene.remove(l); l.geometry.dispose(); l.material.dispose(); tracers.splice(i, 1); }
  }

  // UI timers
  if (hmT > 0) { hmT -= realDt; if (hmT <= 0) hm.style.opacity = 0; }
  if (feedT > 0) { feedT -= realDt; if (feedT <= 0) feedEl.classList.remove("show"); }
  const acc = shotsFired ? Math.round(hits / shotsFired * 100) : 0;
  statsEl.innerHTML = `SHOTS ${shotsFired} &nbsp; ACCURACY ${acc}%<br>HEADSHOTS ${headshots} &nbsp; LIMBS ${severed}<br>SPAWN [T]: ${MODEL_DEFS[SPAWN_KINDS[spawnKind]].label.toUpperCase()}`;

  scene.updateMatrixWorld();
  for (const dm of dummies) dm.pose();
  renderer.render(scene, camera);
}
updateAmmoUI();
step();

// handle for automated testing
window.__game = { renderer, scene, player, camera, dummies, tryShoot: () => { const l = locked; locked = true; gs.cooldown = 0; tryShoot(); locked = l; }, guns, gs, switchWeapon, startReload };
</script>
