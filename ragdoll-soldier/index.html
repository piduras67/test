<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baseplate</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #e9e9e6; font: 13px/1.4 "Inter", "Segoe UI", system-ui, sans-serif; }
  canvas { display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; }
  #dot { position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px; border-radius: 50%; background: rgba(255,255,255,.85); box-shadow: 0 0 0 1px rgba(0,0,0,.35); transition: opacity .15s; }
  #hit { position: absolute; left: 50%; top: 50%; width: 18px; height: 18px; margin: -9px; opacity: 0; }
  #hit::before, #hit::after { content: ""; position: absolute; left: 8px; top: -1px; width: 2px; height: 20px; background: rgba(255,255,255,.9); transform: rotate(45deg); }
  #hit::after { transform: rotate(-45deg); }
  #ammo { position: absolute; right: 28px; bottom: 24px; font-variant-numeric: tabular-nums; letter-spacing: .5px; text-shadow: 0 1px 3px rgba(0,0,0,.5); opacity: .85; }
  #ammo b { font-size: 22px; font-weight: 600; }
  #help { position: absolute; left: 24px; top: 20px; opacity: .55; text-shadow: 0 1px 3px rgba(0,0,0,.5); transition: opacity 1.5s; }
  #start { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(8,9,10,.62); cursor: pointer; }
  #start div { text-align: center; letter-spacing: .3px; }
  #start .t { font-size: 15px; opacity: .9; }
  #start .s { margin-top: 6px; opacity: .45; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
  }
}
</script>
</head>
<body>
<div id="hud">
  <div id="dot"></div>
  <div id="hit"></div>
  <div id="help">LMB fire &nbsp;·&nbsp; RMB aim &nbsp;·&nbsp; R reload &nbsp;·&nbsp; E new target &nbsp;·&nbsp; Q slow motion</div>
  <div id="ammo"><b id="mag">12</b> / 12</div>
</div>
<div id="start"><div><div class="t" id="startText">Loading…</div><div class="s">WASD to move</div></div></div>

<script type="module">
import * as THREE from "three";
import * as CANNON from "cannon-es";
import { Sky } from "three/addons/objects/Sky.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { ShaderPass } from "three/addons/postprocessing/ShaderPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

const rand = (a, b) => a + Math.random() * (b - a);
const V = () => new THREE.Vector3();

// ================================================================ renderer, sky, light
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.62;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.matrixWorldAutoUpdate = false; // matrices are updated by hand so the ragdoll can override bones before each render
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.02, 900);
camera.rotation.order = "YXZ";
scene.add(camera);

const sun = new THREE.Vector3().setFromSphericalCoords(1, THREE.MathUtils.degToRad(58), THREE.MathUtils.degToRad(215));
const sky = new Sky();
sky.scale.setScalar(4000);
Object.assign(sky.material.uniforms.turbidity, { value: 4 });
sky.material.uniforms.rayleigh.value = 1.1;
sky.material.uniforms.mieCoefficient.value = 0.004;
sky.material.uniforms.mieDirectionalG.value = 0.82;
sky.material.uniforms.sunPosition.value.copy(sun);
scene.add(sky);
{
  // image-based lighting from the same sky, so reflections and ambient match it
  const pmrem = new THREE.PMREMGenerator(renderer);
  const envScene = new THREE.Scene();
  const envSky = new Sky(); envSky.scale.setScalar(4000);
  for (const k of ["turbidity", "rayleigh", "mieCoefficient", "mieDirectionalG"]) envSky.material.uniforms[k].value = sky.material.uniforms[k].value;
  envSky.material.uniforms.sunPosition.value.copy(sun);
  envScene.add(envSky);
  scene.environment = pmrem.fromScene(envScene).texture;
}
scene.fog = new THREE.Fog(0xb9c6d2, 60, 340);

const sunLight = new THREE.DirectionalLight(0xfff0dc, 3.2);
sunLight.position.copy(sun).multiplyScalar(40);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(4096, 4096);
Object.assign(sunLight.shadow.camera, { left: -18, right: 18, top: 18, bottom: -18, near: 1, far: 120 });
sunLight.shadow.bias = -0.00025;
sunLight.shadow.normalBias = 0.025;
sunLight.shadow.radius = 3;
scene.add(sunLight, sunLight.target);
scene.add(new THREE.HemisphereLight(0xcfe0ff, 0x6b6257, 0.35));

// ================================================================ the baseplate
function canvasTex(size, draw) {
  const c = document.createElement("canvas"); c.width = c.height = size;
  draw(c.getContext("2d"), size);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
const plateColor = canvasTex(1024, (g, n) => {
  g.fillStyle = "#7b7d80"; g.fillRect(0, 0, n, n);
  // large soft tonal variation, fine grain, and a faint 4 m grid like a studio baseplate
  for (let i = 0; i < 70; i++) { const v = rand(110, 135) | 0; g.fillStyle = `rgba(${v},${v + 1},${v + 3},0.06)`; g.beginPath(); g.arc(rand(0, n), rand(0, n), rand(60, 260), 0, 7); g.fill(); }
  for (let i = 0; i < 60000; i++) { const v = rand(90, 160) | 0; g.fillStyle = `rgba(${v},${v},${v},0.06)`; g.fillRect(rand(0, n), rand(0, n), 1.5, 1.5); }
  g.strokeStyle = "rgba(40,42,46,0.35)"; g.lineWidth = 3;
  g.strokeRect(1.5, 1.5, n - 3, n - 3);
  g.strokeStyle = "rgba(40,42,46,0.12)"; g.lineWidth = 2;
  for (let i = 1; i < 4; i++) { g.beginPath(); g.moveTo(i * n / 4, 0); g.lineTo(i * n / 4, n); g.moveTo(0, i * n / 4); g.lineTo(n, i * n / 4); g.stroke(); }
});
plateColor.colorSpace = THREE.SRGBColorSpace;
const plateRough = canvasTex(512, (g, n) => {
  g.fillStyle = "#c8c8c8"; g.fillRect(0, 0, n, n);
  for (let i = 0; i < 40; i++) { const v = rand(150, 230) | 0; g.fillStyle = `rgba(${v},${v},${v},0.25)`; g.beginPath(); g.arc(rand(0, n), rand(0, n), rand(30, 120), 0, 7); g.fill(); }
});
for (const t of [plateColor, plateRough]) t.repeat.set(100, 100);
const plate = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshStandardMaterial({ map: plateColor, roughnessMap: plateRough, roughness: 1, metalness: 0 }));
plate.rotation.x = -Math.PI / 2;
plate.receiveShadow = true;
scene.add(plate);

// ================================================================ post-processing
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.14, 0.5, 0.95);
composer.addPass(bloom);
composer.addPass(new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uTime: { value: 0 } },
  vertexShader: "varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }",
  // gentle vignette and film grain, nothing showy
  fragmentShader: `uniform sampler2D tDiffuse; uniform float uTime; varying vec2 vUv;
    float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233)) + uTime) * 43758.5453); }
    void main(){ vec4 c = texture2D(tDiffuse, vUv); vec2 d = vUv - 0.5; c.rgb *= 1.0 - dot(d, d) * 0.55; c.rgb += (h(vUv * 800.0) - 0.5) * 0.012; gl_FragColor = c; }`,
}));
composer.addPass(new OutputPass());

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
});

// ================================================================ sound (synthesised, no files)
const Sound = (() => {
  let ctx = null, master, verb, nbuf;
  function init() {
    if (ctx) { ctx.resume(); return; }
    ctx = new AudioContext();
    master = ctx.createDynamicsCompressor(); master.threshold.value = -12; master.ratio.value = 5;
    const vol = ctx.createGain(); vol.gain.value = 0.85; master.connect(vol); vol.connect(ctx.destination);
    // an open-air tail: short, bright early reflection and a long faint decay
    const conv = ctx.createConvolver(), len = (ctx.sampleRate * 2.2) | 0, ir = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 5) * (i < 900 ? 0.3 : 1); }
    conv.buffer = ir; verb = ctx.createGain(); verb.gain.value = 0.22; verb.connect(conv); conv.connect(master);
    nbuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const nd = nbuf.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
  }
  const ok = () => ctx && ctx.state === "running";
  function out(pos, wet = 1) {
    const g = ctx.createGain(); let tail = g;
    if (pos) {
      const p = ctx.createPanner(); p.panningModel = "HRTF"; p.distanceModel = "inverse"; p.refDistance = 3; p.rolloffFactor = 1;
      p.positionX.value = pos.x; p.positionY.value = pos.y; p.positionZ.value = pos.z; g.connect(p); tail = p;
    }
    tail.connect(master);
    if (wet) { const w = ctx.createGain(); w.gain.value = wet; tail.connect(w); w.connect(verb); }
    return g;
  }
  function noise(d, t, dur, type, f, q, gain, att = 0.002) {
    const s = ctx.createBufferSource(); s.buffer = nbuf;
    const fl = ctx.createBiquadFilter(); fl.type = type; fl.frequency.value = f; fl.Q.value = q;
    const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + att); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(fl); fl.connect(g); g.connect(d); s.start(t, Math.random() * 1.5); s.stop(t + dur + 0.05);
  }
  function tone(d, t, dur, f0, f1, gain, type = "sine") {
    const o = ctx.createOscillator(); o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
    const g = ctx.createGain(); g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(d); o.start(t); o.stop(t + dur + 0.05);
  }
  return {
    init,
    listener(cam) {
      if (!ok()) return;
      const l = ctx.listener, p = cam.position, f = V().set(0, 0, -1).applyQuaternion(cam.quaternion), u = V().set(0, 1, 0).applyQuaternion(cam.quaternion);
      if (l.positionX) { l.positionX.value = p.x; l.positionY.value = p.y; l.positionZ.value = p.z; l.forwardX.value = f.x; l.forwardY.value = f.y; l.forwardZ.value = f.z; l.upX.value = u.x; l.upY.value = u.y; l.upZ.value = u.z; }
    },
    shot() {
      if (!ok()) return; const t = ctx.currentTime, d = out(null, 1.3);
      noise(d, t, 0.06, "highpass", 2000, 0.4, 0.8);
      noise(d, t, 0.25, "lowpass", 1500, 0.6, 0.85);
      tone(d, t, 0.16, 160, 42, 0.85);
      noise(d, t + 0.02, 0.9, "bandpass", 420, 0.4, 0.12, 0.03); // distant slap-back
    },
    click(gain = 0.25, f = 2600) { if (!ok()) return; const t = ctx.currentTime, d = out(null, 0.2); noise(d, t, 0.03, "bandpass", f, 3, gain); tone(d, t, 0.02, f * 1.3, f, gain * 0.4, "triangle"); },
    magOut() { this.click(0.3, 2100); },
    magIn() { if (!ok()) return; const t = ctx.currentTime, d = out(null, 0.2); noise(d, t, 0.05, "bandpass", 1500, 3, 0.35); tone(d, t, 0.04, 950, 520, 0.12, "triangle"); },
    rack() { if (!ok()) return; const t = ctx.currentTime, d = out(null, 0.3); noise(d, t, 0.05, "bandpass", 1900, 3, 0.3); noise(d, t + 0.11, 0.06, "bandpass", 2700, 3, 0.38); },
    shell(pos) { if (!ok()) return; const t = ctx.currentTime, d = out(pos, 0.2), f = rand(4300, 6200); tone(d, t, 0.16, f, f * 0.97, 0.07); tone(d, t, 0.1, f * 1.5, f * 1.49, 0.03); },
    flesh(pos) { if (!ok()) return; const t = ctx.currentTime, d = out(pos, 0.3); noise(d, t, 0.14, "lowpass", 620, 1.2, 0.7); noise(d, t + 0.01, 0.2, "bandpass", 230, 2.4, 0.45); tone(d, t, 0.12, 105, 45, 0.5); },
    crack(pos) { if (!ok()) return; const t = ctx.currentTime, d = out(pos, 0.3); for (let i = 0; i < 4; i++) noise(d, t + i * 0.011, 0.035, "bandpass", rand(1300, 2600), 4, 0.3); this.flesh(pos); },
    thud(pos, s) {
      if (!ok()) return; const t = ctx.currentTime, d = out(pos, 0.35), g = Math.min(1, s / 5);
      tone(d, t, 0.22, 85, 34, 0.75 * g); noise(d, t, 0.16, "lowpass", 380, 1, 0.55 * g); noise(d, t, 0.35, "bandpass", 900, 0.8, 0.12 * g); // body + cloth + grit
    },
    drip(pos) { if (!ok()) return; const t = ctx.currentTime, d = out(pos, 0.1), f = rand(900, 1500); tone(d, t, 0.06, f, f * 1.8, 0.05); },
    step(gain) { if (!ok()) return; const t = ctx.currentTime, d = out(null, 0.05); noise(d, t, 0.08, "lowpass", 450, 1, gain); noise(d, t, 0.04, "highpass", 3000, 1, gain * 0.25); },
    // wet, bubbling breaths through blood
    gurgle(pos, s = 1) {
      if (!ok()) return; const t = ctx.currentTime, d = out(pos, 0.15);
      for (let i = 0; i < 9; i++) noise(d, t + i * rand(0.035, 0.07), rand(0.04, 0.09), "bandpass", rand(260, 620), 6, 0.16 * s);
      noise(d, t, 0.6, "bandpass", 500, 1.5, 0.06 * s, 0.1);
    },
    breath(pos) { if (!ok()) return; const t = ctx.currentTime, d = out(pos, 0.1); noise(d, t, 0.5, "bandpass", 700, 1.2, 0.08, 0.15); },
  };
})();

// ================================================================ physics
const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -9.82, 0) });
world.broadphase = new CANNON.SAPBroadphase(world);
world.allowSleep = true;
world.solver.iterations = 30;
const groundMat = new CANNON.Material("ground"), fleshMat = new CANNON.Material("flesh");
world.addContactMaterial(new CANNON.ContactMaterial(groundMat, fleshMat, { friction: 0.8, restitution: 0, contactEquationStiffness: 5e6, contactEquationRelaxation: 5, frictionEquationStiffness: 5e6, frictionEquationRelaxation: 5 }));
const ground = new CANNON.Body({ mass: 0, material: groundMat, shape: new CANNON.Plane() });
ground.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
world.addBody(ground);

// ================================================================ 3D blood
// droplets are real little glossy meshes, stretched along their velocity
const bloodMat = new THREE.MeshPhysicalMaterial({ color: 0x5a0303, roughness: 0.12, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.06, sheen: 0.2, sheenColor: new THREE.Color(0x400000) });
const MAX_DROPS = 2500;
const dropMesh = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1, 1), bloodMat, MAX_DROPS);
dropMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
dropMesh.frustumCulled = false; dropMesh.castShadow = true;
scene.add(dropMesh);
const drops = Array.from({ length: MAX_DROPS }, () => ({ on: false, p: V(), v: V(), r: 0, life: 0 }));
let dropCursor = 0;
const ZERO = new THREE.Matrix4().makeScale(0, 0, 0);
const UPV = new THREE.Vector3(0, 1, 0);
for (let i = 0; i < MAX_DROPS; i++) dropMesh.setMatrixAt(i, ZERO);
function drop(pos, vel, r) {
  const d = drops[dropCursor]; dropCursor = (dropCursor + 1) % MAX_DROPS;
  d.on = true; d.p.copy(pos); d.v.copy(vel); d.r = r; d.life = 3;
}
function spray(pos, dir, n, speed, spread, rMin = 0.004, rMax = 0.014) {
  const v = V();
  for (let i = 0; i < n; i++) {
    v.copy(dir).multiplyScalar(speed * rand(0.25, 1)).add(new THREE.Vector3(rand(-spread, spread), rand(-spread * 0.6, spread), rand(-spread, spread)));
    drop(pos, v, Math.random() < 0.12 ? rand(rMax, rMax * 1.8) : rand(rMin, rMax));
  }
}

// on the ground: soft-edged wet splats (textured), and smooth glossy pools that spread under the body
function splatTexture() {
  const c = document.createElement("canvas"); c.width = c.height = 256; const g = c.getContext("2d");
  const cx = 128, cy = 128;
  const main = g.createRadialGradient(cx, cy, 6, cx, cy, 64);
  main.addColorStop(0, "rgba(58,2,2,1)"); main.addColorStop(0.7, "rgba(86,4,4,0.95)"); main.addColorStop(1, "rgba(96,6,6,0)");
  g.fillStyle = main; g.beginPath(); g.arc(cx, cy, rand(34, 58), 0, 7); g.fill();
  for (let i = 0; i < 22; i++) {
    const a = rand(0, 7), d = rand(28, 110), r = rand(1.5, 9);
    g.fillStyle = `rgba(${rand(60, 100) | 0},3,3,${rand(0.75, 1)})`;
    g.beginPath(); g.arc(cx + Math.cos(a) * d, cy + Math.sin(a) * d, r, 0, 7); g.fill();
    if (Math.random() < 0.4) { g.strokeStyle = g.fillStyle; g.lineWidth = r * 0.6; g.beginPath(); g.moveTo(cx + Math.cos(a) * d * 0.55, cy + Math.sin(a) * d * 0.55); g.lineTo(cx + Math.cos(a) * d, cy + Math.sin(a) * d); g.stroke(); }
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
const splatMats = [0, 1, 2, 3].map(() => new THREE.MeshStandardMaterial({ map: splatTexture(), transparent: true, depthWrite: false, roughness: 0.22, metalness: 0, polygonOffset: true, polygonOffsetFactor: -2, envMapIntensity: 0.5 }));
const splatGeo = new THREE.PlaneGeometry(1, 1); splatGeo.rotateX(-Math.PI / 2);
const splats = [];
function splat(x, z, size, stretchDir) {
  const m = new THREE.Mesh(splatGeo, splatMats[(Math.random() * 4) | 0]);
  m.position.set(x, 0.002 + splats.length % 20 * 0.00005, z);
  m.rotation.y = stretchDir !== undefined ? stretchDir : rand(0, 7);
  m.scale.set(size * (stretchDir !== undefined ? 1.7 : 1), 1, size);
  m.receiveShadow = true;
  scene.add(m); splats.push(m);
  if (splats.length > 350) scene.remove(splats.shift());
}
const woundMat = new THREE.MeshStandardMaterial({ map: splatTexture(), transparent: true, depthWrite: false, roughness: 0.2, polygonOffset: true, polygonOffsetFactor: -4 });
function poolGeometry(seed) {
  const shape = new THREE.Shape(), n = 64;
  for (let i = 0; i <= n; i++) {
    const a = (i / n) * Math.PI * 2;
    const r = 0.5 * (0.86 + 0.08 * Math.sin(a * 3 + seed) + 0.05 * Math.sin(a * 5 + seed * 2.1));
    if (i === 0) shape.moveTo(Math.cos(a) * r, Math.sin(a) * r); else shape.lineTo(Math.cos(a) * r, Math.sin(a) * r);
  }
  const g = new THREE.ExtrudeGeometry(shape, { depth: 0.0004, bevelEnabled: true, bevelThickness: 0.0025, bevelSize: 0.025, bevelSegments: 6, curveSegments: 8 });
  g.rotateX(-Math.PI / 2);
  return g;
}
const poolMat = new THREE.MeshPhysicalMaterial({ color: 0x3c0000, roughness: 0.12, metalness: 0, clearcoat: 0.6, clearcoatRoughness: 0.1, specularIntensity: 0.45, envMapIntensity: 0.55 });
const pools = [];
function pool(x, z, max) {
  for (const p of pools) if (Math.hypot(p.x - x, p.z - z) < 0.3) { p.max = Math.min(1.5, Math.max(p.max, max)); return; }
  const m = new THREE.Mesh(poolGeometry(rand(0, 9)), poolMat);
  m.position.set(x, 0.0015, z); m.rotation.y = rand(0, 6.28); m.scale.set(0.05, 1, 0.05); m.receiveShadow = true;
  scene.add(m); pools.push({ x, z, m, s: 0.05, max });
}

// ================================================================ dust and smoke
const smokeTex = (() => {
  const c = document.createElement("canvas"); c.width = c.height = 128; const g = c.getContext("2d");
  for (let i = 0; i < 26; i++) {
    const x = 64 + rand(-26, 26), y = 64 + rand(-26, 26), r = rand(14, 40);
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, "rgba(255,255,255,0.16)"); gr.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
})();
const puffs = [];
function dust(pos, amount, color = 0xb5ada2) {
  for (let i = 0; i < amount; i++) {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: smokeTex, color, transparent: true, depthWrite: false, opacity: 0, rotation: rand(0, 6.28) }));
    s.position.copy(pos).add(new THREE.Vector3(rand(-0.15, 0.15), rand(0, 0.08), rand(-0.15, 0.15)));
    const a = rand(0, Math.PI * 2), sp = rand(0.25, 0.9);
    s.userData = { t: 0, life: rand(1.2, 2.2), v: new THREE.Vector3(Math.cos(a) * sp, rand(0.05, 0.25), Math.sin(a) * sp), size: rand(0.22, 0.45), spin: rand(-0.4, 0.4) };
    scene.add(s); puffs.push(s);
  }
}
const muzzleSmoke = (pos, dir) => {

// rotate a bone so that one of its world directions turns toward another (blended by weight)
function aimBone(bone, from, to, w) {
  const q = new THREE.Quaternion().setFromUnitVectors(from.clone().normalize(), to.clone().normalize());
  if (w < 1) q.copy(qI.clone().slerp(q, w));

  bone.quaternion.copy(parentQ.invert().multiply(q.multiply(worldQ)));

  const dir = toT.normalize();
  const cosA = THREE.MathUtils.clamp((a * a + d * d - b * b) / (2 * a * d), -1, 1);
  const side = pole.clone().sub(S); side.addScaledVector(dir, -side.dot(dir)).normalize();

  }
  gripHand(hs, count) {
    const fore = this.parts[hs === "L" ? "lArmL" : "lArmR"];
    const upper = this.parts[hs === "L" ? "uArmL" : "uArmR"];
    // a holding arm is tense, not floppy: kill its spin so it doesn't jiggle against the elbow limit
    for (const part of [fore, upper]) { const w = part.body.angularVelocity; w.scale(0.86, w); }
    const w = this.gripWound.getWorldPosition(V()).add(V().set(hs === "L" ? 0.03 : -0.03, 0, 0).applyQuaternion(toQ(this.parts.chest.body.quaternion)));
    const tip = toV(fore.body.position).add(fore.axis.clone().applyQuaternion(toQ(fore.body.quaternion)).multiplyScalar(fore.len * 0.9));
    const pull = w.sub(tip);
    const strength = THREE.MathUtils.smoothstep(this.balance.t, 0.1, 0.5) * (1 - this.balance.t / this.balance.dur);
    // a critically damped spring, so the hand settles onto the wound instead of bouncing
    const kSpring = 160 * strength, damp = 3 * Math.sqrt(kSpring * fore.body.mass); // a touch over-damped: settles without wobble
    if (pull.length() > 0.5) pull.setLength(0.5);
    const f = pull.multiplyScalar(kSpring).sub(toV(fore.body.velocity).sub(toV(this.parts.chest.body.velocity)).multiplyScalar(damp));
    const rel = tip.clone().sub(toV(fore.body.position));
    fore.body.applyForce(new CANNON.Vec3(f.x, f.y, f.z), new CANNON.Vec3(rel.x, rel.y, rel.z)); // point relative to the body's centre
    const chest = this.parts.chest.body;
    chest.applyForce(new CANNON.Vec3(-f.x * 0.5 / count, -f.y * 0.5 / count, -f.z * 0.5 / count));
  }

  nearestPart(point) {
    let best = "chest", bd = Infinity;
    for (const k in this.parts) {
      const { body, axis, len, def } = this.parts[k];
      const a = toV(body.position), ax = axis.clone().applyQuaternion(toQ(body.quaternion));
      const t = THREE.MathUtils.clamp(point.clone().sub(a).dot(ax), 0, len);
      const d = a.addScaledVector(ax, t).distanceTo(point) - (def.r || def.w[0]);
      if (d < bd) { bd = d; best = k; }
    }
    return best;
  }
  onContact(body, e) {
    if (e.body !== ground) return;
    const v = Math.abs(e.contact.getImpactVelocityAlongNormal());
    const now = performance.now();
    if (v < 0.7 || now - (body.lastHit || 0) < 300) return;
    body.lastHit = now;
    const p = toV(body.position); p.y = 0.03;
    const heavy = body.mass >= 7;
    Sound.thud(p, v * body.mass / 7);
    if (heavy && v > 1.2) dust(p, v > 2.5 ? 3 : 2);
  }
  update(dt) {
    if (this.state !== "ragdoll") { this.mixer.update(dt); return; }
    this.t += dt;
    this.stepBalance(dt);
    this.stepGrip();
    for (const k in this.parts) { const { body, group } = this.parts[k]; group.position.copy(body.position); group.quaternion.copy(body.quaternion); }
    if (!this.balance && this.t > 2) {
      for (const k in this.parts) {
        const part = this.parts[k], b = part.body;
        const quiet = b.velocity.length() < 0.35 && b.angularVelocity.length() < 1.2;
        part.still = quiet ? (part.still || 0) + dt : 0;
        if (part.still > 0.4 && b.sleepState !== CANNON.Body.SLEEPING) { b.velocity.set(0, 0, 0); b.angularVelocity.set(0, 0, 0); b.sleep(); }
      }
    }
  }
  // before the scene matrices update: set bone rotations (and the hips' position) from the bodies
  pose() {
    if (this.state !== "ragdoll") return;
    const worldQ = new Map(), pq = new THREE.Quaternion();
    for (const { bone, part } of this.driven) {
      let parentQ;
      // nearest ancestor we already placed this frame, walking up through any un-driven bones in between
      const chain = [];
      let p = bone.parent;
      while (p && !worldQ.has(p) && p.isBone) { chain.push(p); p = p.parent; }
      if (p && worldQ.has(p)) { parentQ = worldQ.get(p).clone(); for (let i = chain.length - 1; i >= 0; i--) parentQ.multiply(chain[i].quaternion); }
      else parentQ = bone.parent.getWorldQuaternion(pq).clone();
      const want = toQ(part.body.quaternion);
      bone.quaternion.copy(parentQ.invert().multiply(want));
      worldQ.set(bone, want);
    }
    const hips = this.bones.Hips, pel = this.parts.pelvis.body;
    hips.parent.updateMatrixWorld(true);
    hips.position.copy(hips.parent.worldToLocal(toV(pel.position)));
  }
  bleedTick(dt) {
    for (const b of this.bleed) {
      b.t += dt; if (b.t > b.dur) continue;
      const strength = 1 - b.t / b.dur;
      const at = b.obj.getWorldPosition(V());
      const out = V().set(0, 1, 0).applyQuaternion(b.obj.getWorldQuaternion(new THREE.Quaternion()));
      if (b.artery) {
        // heartbeat around 100 bpm that slows and weakens as he bleeds out
        const bpm = 105 - 55 * (1 - strength);
        b.beat = (b.beat || 0) + dt * bpm / 60;
        const phase = b.beat % 1;
        const spurt = phase < 0.22 ? Math.sin(phase / 0.22 * Math.PI) : 0;
        const n = Math.floor(b.rate * dt * (0.15 + spurt * 2.2) * Math.max(0.15, strength) + Math.random() * 0.7);
        for (let i = 0; i < n; i++) {
          const v = out.clone().multiplyScalar((0.6 + spurt * 2.6) * Math.max(0.35, strength) * rand(0.75, 1.1)).add(new THREE.Vector3(rand(-0.12, 0.12), rand(-0.05, 0.12), rand(-0.12, 0.12)));
          drop(at, v, spurt > 0.4 ? rand(0.006, 0.013) : rand(0.004, 0.008));
        }
        if (b.t < 9) { this.gurgleAt = (this.gurgleAt || 0) - dt; if (this.gurgleAt <= 0) { this.gurgleAt = rand(0.9, 1.8); Sound.gurgle(at, strength); } }
        continue;
      }
      const n = Math.floor(b.rate * dt * strength * (0.6 + 0.4 * Math.max(0, Math.sin(b.t * 7))) + Math.random() * 0.6);
      if (!n) continue;
      for (let i = 0; i < n; i++) drop(at, out.clone().multiplyScalar(rand(0.1, 0.5)).add(new THREE.Vector3(rand(-0.1, 0.1), -0.15, rand(-0.1, 0.1))), rand(0.004, 0.008));
    }
    // once he's lying still the wounds pool on the ground
    if (this.state === "ragdoll" && !this.balance && this.t > 3) for (const w of this.wounds) {
      const p = w.obj.getWorldPosition(V());
      const artery = this.bleed.some(b => b.artery);
      if (p.y < 0.4 && Math.random() < dt * 0.8) pool(p.x, p.z, (artery ? 1.3 : 0.55) + this.wounds.length * 0.15);
    }
  }
  remove() {
    scene.remove(this.root);
    for (const k in this.parts) { world.removeBody(this.parts[k].body); scene.remove(this.parts[k].group); }
    for (const k in this.joints) world.removeConstraint(this.joints[k]);
    for (const [m, s] of [...hitMeshes]) if (s === this) hitMeshes.delete(m);
    soldiers.splice(soldiers.indexOf(this), 1);
  }
}

// skinned clone that keeps each copy's skeleton separate
function cloneSkinned(src) {
  const clone = src.clone(true);
  const srcBones = {}, cloneBones = {};
  src.traverse(o => { if (o.isBone) srcBones[o.name] = o; });
  clone.traverse(o => { if (o.isBone) cloneBones[o.name] = o; });
  const srcMeshes = []; src.traverse(o => { if (o.isSkinnedMesh) srcMeshes.push(o); });
  let i = 0;
  clone.traverse(o => {
    if (!o.isSkinnedMesh) return;
    const s = srcMeshes[i++];
    o.skeleton = s.skeleton.clone();
    o.skeleton.bones = s.skeleton.bones.map(b => cloneBones[b.name]);
    o.bind(o.skeleton, s.bindMatrix);
  });
  return clone;
}

// ================================================================ player, input, shooting
const player = { pos: new THREE.Vector3(0, 0, 0), vel: V(), yaw: 0, pitch: -0.05, recoil: 0, recoilYaw: 0, onGround: true };
const keys = {};
let locked = false, aiming = false, slowmo = false, ammo = 12;
const gs = { cd: 0, kick: 0, kickV: 0, slide: 0, swayX: 0, swayY: 0, bob: 0, ads: 0, reloading: false, rt: 0, stage: 0, step: 0 };
const startEl = document.getElementById("start");
startEl.addEventListener("click", () => { if (!MODEL) return; Sound.init(); renderer.domElement.requestPointerLock(); });
document.addEventListener("pointerlockchange", () => { locked = document.pointerLockElement === renderer.domElement; startEl.style.display = locked ? "none" : "grid"; if (!locked) aiming = false; });
const md = { x: 0, y: 0 };
document.addEventListener("mousemove", e => {
  if (!locked) return;
  const s = aiming ? 0.0011 : 0.002;
  player.yaw -= e.movementX * s; player.pitch = THREE.MathUtils.clamp(player.pitch - e.movementY * s, -1.45, 1.45);
  md.x += e.movementX; md.y += e.movementY;
});
document.addEventListener("mousedown", e => { if (!locked) return; if (e.button === 0) shoot(); if (e.button === 2) aiming = true; });
document.addEventListener("mouseup", e => { if (e.button === 2) aiming = false; });
document.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("keydown", e => {
  keys[e.code] = true;
  if (!locked) return;
  if (e.code === "KeyR") reload();
  if (e.code === "KeyE") spawnTarget();
  if (e.code === "KeyQ") slowmo = !slowmo;
  if (e.code === "Space" && player.onGround) { player.vel.y = 4.2; player.onGround = false; }
});
document.addEventListener("keyup", e => { keys[e.code] = false; });
const magEl = document.getElementById("mag"), hitEl = document.getElementById("hit");
let hitT = 0;

function reload() {
  if (gs.reloading || ammo === 12) return;
  gs.reloading = true; gs.rt = 0; gs.stage = 0;
}
const raycaster = new THREE.Raycaster();
function shoot() {
  if (gs.cd > 0 || gs.reloading) return;
  if (ammo <= 0) { Sound.click(0.35, 3200); gs.cd = 0.25; reload(); return; }
  ammo--; magEl.textContent = ammo; gs.cd = 0.13;
  gs.kickV += 3.2; gs.slide = 1;
  player.recoil += aiming ? 0.028 : 0.045; player.recoilYaw += rand(-0.012, 0.012);
  muzzle.getWorldPosition(flash.position);
  flash.scale.setScalar(rand(0.12, 0.18)); flash.material.rotation = rand(0, 6.28); flash.visible = true; flash.userData.t = 0.04;
  flashLight.position.copy(flash.position); flashLight.intensity = 5;
  muzzleSmoke(flash.position, V().set(0, 0, -1).applyQuaternion(camera.quaternion));
  ejectShell();
  Sound.shot();
  const spread = aiming ? 0.0015 : 0.006;
  const dir = new THREE.Vector3(rand(-spread, spread), rand(-spread, spread), -1).normalize().applyQuaternion(camera.quaternion);
  raycaster.set(camera.position, dir); raycaster.far = 300;
  const meshes = [...hitMeshes.keys()];
  for (const m of meshes) { m.boundingSphere = null; m.boundingBox = null; }
  const hit = raycaster.intersectObjects([...meshes, plate], false)[0];
  if (!hit) return;
  if (hit.object === plate) {
    dust(hit.point, 2, 0x9c968c);
    return;
  }
  const s = hitMeshes.get(hit.object);
  let n = hit.face ? hit.face.normal.clone().transformDirection(hit.object.matrixWorld) : dir.clone().negate();
  if (n.dot(dir) > 0) n.negate();
  s.hit(hit.point, n, dir);
  hitEl.style.opacity = 1; hitT = 0.12;
}

function spawnTarget() {
  const fwd = V().set(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
  const p = player.pos.clone().addScaledVector(fwd, 7);
  new Soldier(p.x, p.z, player.yaw + Math.PI); // facing you
  if (soldiers.length > 3) soldiers[0].remove();
}

// ================================================================ simulation step and render
function update(realDt) {
  const dt = realDt * (slowmo ? 0.3 : 1);
  // player
  const fwd = V().set(-Math.sin(player.yaw), 0, -Math.cos(player.yaw)), right = V().set(-fwd.z, 0, fwd.x);
  const wish = V();
  if (keys.KeyW) wish.add(fwd); if (keys.KeyS) wish.sub(fwd); if (keys.KeyD) wish.add(right); if (keys.KeyA) wish.sub(right);
  const sprint = keys.ShiftLeft && !aiming;
  if (wish.lengthSq()) wish.normalize().multiplyScalar(aiming ? 2 : sprint ? 6 : 3.8);
  const k = 1 - Math.exp(-realDt * (player.onGround ? 11 : 2));
  player.vel.x += (wish.x - player.vel.x) * k; player.vel.z += (wish.z - player.vel.z) * k;
  player.vel.y -= 12 * realDt;
  player.pos.addScaledVector(player.vel, realDt);
  if (player.pos.y <= 0) { player.pos.y = 0; player.vel.y = 0; player.onGround = true; }
  const moving = Math.hypot(player.vel.x, player.vel.z);
  if (player.onGround && moving > 0.6) { gs.step -= realDt * moving; if (gs.step <= 0) { gs.step = 1.75; Sound.step(sprint ? 0.16 : 0.1); } }
  player.recoil *= Math.exp(-realDt * 8); player.recoilYaw *= Math.exp(-realDt * 8);
  camera.position.set(player.pos.x, player.pos.y + 1.64 + Math.abs(Math.sin(gs.bob)) * 0.012 * Math.min(1, moving / 4) * (1 - gs.ads), player.pos.z);
  camera.rotation.set(player.pitch + player.recoil, player.yaw + player.recoilYaw, 0);
  camera.fov += ((aiming ? 50 : 70) - camera.fov) * (1 - Math.exp(-realDt * 14)); camera.updateProjectionMatrix();
  // sun shadows follow the player
  sunLight.target.position.set(player.pos.x, 0, player.pos.z - 4);
  sunLight.position.copy(sunLight.target.position).addScaledVector(sun, 40);
  sunLight.target.updateMatrixWorld();

  // gun
  gs.cd -= realDt;
  gs.ads += ((aiming && !gs.reloading ? 1 : 0) - gs.ads) * (1 - Math.exp(-realDt * 16));
  gs.swayX += (-md.x * 0.0002 - gs.swayX) * (1 - Math.exp(-realDt * 10)); gs.swayY += (md.y * 0.0002 - gs.swayY) * (1 - Math.exp(-realDt * 10)); md.x = md.y = 0;
  gs.bob += realDt * moving * 1.7;
  gs.kickV += (-gs.kick * 400 - gs.kickV * 25) * realDt; gs.kick += gs.kickV * realDt;
  gs.slide = Math.max(0, gs.slide - realDt * 14);
  const base = new THREE.Vector3(0.16, -0.145, -0.34).lerp(new THREE.Vector3(0, -0.0805, -0.28), gs.ads);
  const bob = (1 - gs.ads * 0.85) * Math.min(1, moving / 4);
  const gp = base.clone();
  gp.x += Math.cos(gs.bob) * 0.011 * bob + gs.swayX * (1 - gs.ads * 0.7);
  gp.y += Math.abs(Math.sin(gs.bob)) * 0.012 * bob + gs.swayY * (1 - gs.ads * 0.7) - (sprint ? 0.03 : 0);
  gp.z += gs.kick * 0.8;
  let rx = gs.kick * 3, rz = gs.swayX * 3 + (sprint ? 0.3 : 0);
  if (gs.reloading) {
    gs.rt += realDt; const t = gs.rt / 1.5;
    const tilt = Math.sin(Math.min(1, t * 1.2) * Math.PI);
    rz += tilt * 0.5; rx += tilt * 0.2; gp.y -= tilt * 0.035;
    if (t < 0.25) mag.position.copy(magHome).y -= (t / 0.25) * 0.13;
    else if (t < 0.55) { if (gs.stage < 1) { gs.stage = 1; Sound.magOut(); } mag.visible = false; }
    else if (t < 0.8) { mag.visible = true; mag.position.copy(magHome).y -= (1 - (t - 0.55) / 0.25) * 0.13; if (t > 0.74 && gs.stage < 2) { gs.stage = 2; Sound.magIn(); } }
    else { mag.position.copy(magHome); if (gs.stage < 3) { gs.stage = 3; Sound.rack(); } gs.slide = Math.max(gs.slide, Math.sin((t - 0.8) / 0.2 * Math.PI)); }
    if (t >= 1) { gs.reloading = false; ammo = 12; magEl.textContent = ammo; mag.visible = true; mag.position.copy(magHome); }
  }
  slide.position.z = gs.slide * 0.034;
  gun.position.copy(gp); gun.rotation.set(rx, gs.swayX * 2, rz);
  document.getElementById("dot").style.opacity = 1 - gs.ads;
  if (flash.visible) { flash.userData.t -= realDt; muzzle.getWorldPosition(flash.position); if (flash.userData.t <= 0) flash.visible = false; }
  flashLight.intensity *= Math.exp(-realDt * 45);
  if (hitT > 0) { hitT -= realDt; if (hitT <= 0) hitEl.style.opacity = 0; }

  // world
  world.step(1 / 180, dt, 12);
  for (const s of soldiers) { s.update(dt); s.bleedTick(dt); }

  // droplets: fly, stretch along their motion, land as puddles
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), sc = V();
  for (let i = 0; i < MAX_DROPS; i++) {
    const d = drops[i];
    if (!d.on) continue;
    d.v.y -= 9.8 * dt; d.v.multiplyScalar(1 - 0.4 * dt);
    d.p.addScaledVector(d.v, dt);
    d.life -= dt;
    if (d.p.y <= 0.002) {
      d.on = false; dropMesh.setMatrixAt(i, ZERO);
      const speed = Math.hypot(d.v.x, d.v.z);
      if (Math.random() < 0.55 || d.r > 0.01) splat(d.p.x, d.p.z, d.r * rand(4, 7) * (1 + speed * 0.15), speed > 1.5 ? Math.atan2(-d.v.z, d.v.x) : undefined);
      if (d.r > 0.012 && Math.random() < 0.2) Sound.drip(d.p);
      continue;
    }
    if (d.life <= 0) { d.on = false; dropMesh.setMatrixAt(i, ZERO); continue; }
    const sp = d.v.length();
    q.setFromUnitVectors(UPV, sp > 1e-4 ? d.v.clone().divideScalar(sp) : UPV);
    sc.set(d.r, d.r * (1 + Math.min(3, sp * 0.35)), d.r);
    m.compose(d.p, q, sc);
    dropMesh.setMatrixAt(i, m);
  }
  dropMesh.instanceMatrix.needsUpdate = true;
  for (const p of pools) if (p.s < p.max) { p.s = Math.min(p.max, p.s + dt * 0.045); p.m.scale.set(p.s, 1, p.s); }

  // smoke and dust
  for (let i = puffs.length - 1; i >= 0; i--) {
    const s = puffs[i], u = s.userData;
    u.t += dt; const a = u.t / u.life;
    s.position.addScaledVector(u.v, dt); u.v.multiplyScalar(1 - 1.6 * dt);
    s.scale.setScalar(u.size * (1 + a * (u.grow ? 6 : 2.2)));
    s.material.rotation += u.spin * dt;
    s.material.opacity = Math.min(1, a * 8) * (1 - a) * (u.grow ? 0.35 : 0.3);
    if (a >= 1) { scene.remove(s); s.material.dispose(); puffs.splice(i, 1); }
  }
  // shells
  for (const sh of shells) {
    const u = sh.userData; if (u.rest) continue;
    u.v.y -= 9.8 * dt; sh.position.addScaledVector(u.v, dt);
    sh.rotation.x += u.spin.x * dt; sh.rotation.y += u.spin.y * dt; sh.rotation.z += u.spin.z * dt;
    if (sh.position.y < 0.005) {
      sh.position.y = 0.005;
      if (Math.abs(u.v.y) > 0.6) Sound.shell(sh.position.clone());
      u.v.y *= -0.4; u.v.x *= 0.6; u.v.z *= 0.6; u.spin.multiplyScalar(0.5);
      if (Math.abs(u.v.y) < 0.4) { u.rest = true; sh.rotation.set(Math.PI / 2, 0, rand(0, 6.28)); }
    }
  }
  Sound.listener(camera);
}

function render() {
  for (const s of soldiers) s.pose();
  scene.updateMatrixWorld();
  composer.passes[composer.passes.length - 2].uniforms && (composer.passes[composer.passes.length - 2].uniforms.uTime.value = performance.now() * 0.001);
  composer.render();
}

const clock = new THREE.Clock();
function loop() {
  requestAnimationFrame(loop);
  update(Math.min(clock.getDelta(), 0.05));
  render();
}

// ================================================================ start
new GLTFLoader().load("models/Soldier.glb", g => {
  MODEL = g;
  g.scene.updateMatrixWorld(true);
  const head = g.scene.getObjectByName(BN("Head")), foot = g.scene.getObjectByName(BN("LeftFoot"));
  const span = head.getWorldPosition(V()).y - foot.getWorldPosition(V()).y;
  MODEL_SCALE = span > 0.01 ? 1.8 * 0.85 / span : 1;
  new Soldier(0, -5, Math.PI);
  document.getElementById("startText").textContent = "Click to start";
  setTimeout(() => (document.getElementById("help").style.opacity = 0), 9000);
}, undefined, e => { document.getElementById("startText").textContent = location.protocol === "file:" ? "Run start.bat to open this through localhost" : "Couldn't load the soldier model"; });
loop();

// testing hooks
window.__game = { player, soldiers, camera, shoot: () => { gs.cd = 0; shoot(); }, update, render, spawnTarget };
</script>
