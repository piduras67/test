<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baseplate</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #e9e9e6; font: 13px/1.4 "Inter", "Segoe UI", system-ui, sans-serif; }
  canvas { display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; }
  #dot { position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px; border-radius: 50%; background: rgba(255,255,255,.85); box-shadow: 0 0 0 1px rgba(0,0,0,.35); transition: opacity .15s; }
  #hit { position: absolute; left: 50%; top: 50%; width: 18px; height: 18px; margin: -9px; opacity: 0; }
  #hit::before, #hit::after { content: ""; position: absolute; left: 8px; top: -1px; width: 2px; height: 20px; background: rgba(255,255,255,.9); transform: rotate(45deg); }
  #hit::after { transform: rotate(-45deg); }
  #ammo { position: absolute; right: 28px; bottom: 24px; font-variant-numeric: tabular-nums; letter-spacing: .5px; text-shadow: 0 1px 3px rgba(0,0,0,.5); opacity: .85; }
  #ammo b { font-size: 22px; font-weight: 600; }
  #help { position: absolute; left: 24px; top: 20px; opacity: .55; text-shadow: 0 1px 3px rgba(0,0,0,.5); transition: opacity 1.5s; }
  #start { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(8,9,10,.62); cursor: pointer; }
  #start div { text-align: center; letter-spacing: .3px; }
  #start .t { font-size: 15px; opacity: .9; }
  #start .s { margin-top: 6px; opacity: .45; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
  }
}
</script>
</head>
<body>
<div id="hud">
  <div id="dot"></div>
  <div id="hit"></div>
  <div id="help">1 pistol &nbsp;·&nbsp; 2 rifle &nbsp;·&nbsp; 3 shotgun &nbsp;·&nbsp; 4 sword &nbsp;·&nbsp; V first / third person &nbsp;·&nbsp; LMB fire / slash &nbsp;·&nbsp; RMB aim / stab &nbsp;·&nbsp; R reload &nbsp;·&nbsp; E new target &nbsp;·&nbsp; Q slow motion</div>
  <div id="ammo"><b id="mag">12</b> / <span id="magSize">12</span></div>
</div>
<div id="start"><div><div class="t" id="startText">Loading…</div><div class="s">WASD to move</div></div></div>

<script type="module">
import * as THREE from "three";
import * as CANNON from "cannon-es";
import { Sky } from "three/addons/objects/Sky.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { ShaderPass } from "three/addons/postprocessing/ShaderPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

const rand = (a, b) => a + Math.random() * (b - a);
// blood switch: false turns off every blood effect (drops, splats, pools, stains, wall runs, gibs). set to true to bring it back.
const BLOOD = false;
const V = () => new THREE.Vector3();

// ================================================================ renderer, sky, light
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.62;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.matrixWorldAutoUpdate = false; // matrices are updated by hand so the ragdoll can override bones before each render
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.01, 900);
camera.rotation.order = "YXZ";
scene.add(camera);

const sun = new THREE.Vector3().setFromSphericalCoords(1, THREE.MathUtils.degToRad(58), THREE.MathUtils.degToRad(215));
const sky = new Sky();
sky.scale.setScalar(4000);
Object.assign(sky.material.uniforms.turbidity, { value: 4 });
sky.material.uniforms.rayleigh.value = 1.1;
sky.material.uniforms.mieCoefficient.value = 0.004;
sky.material.uniforms.mieDirectionalG.value = 0.82;
sky.material.uniforms.sunPosition.value.copy(sun);
scene.add(sky);
{
  // image-based lighting from the same sky, so reflections and ambient match it
  const pmrem = new THREE.PMREMGenerator(renderer);
  const envScene = new THREE.Scene();
  const envSky = new Sky(); envSky.scale.setScalar(4000);
  for (const k of ["turbidity", "rayleigh", "mieCoefficient", "mieDirectionalG"]) envSky.material.uniforms[k].value = sky.material.uniforms[k].value;
  envSky.material.uniforms.sunPosition.value.copy(sun);
  envScene.add(envSky);
  scene.environment = pmrem.fromScene(envScene).texture;
}
scene.fog = new THREE.Fog(0xb9c6d2, 60, 340);

const sunLight = new THREE.DirectionalLight(0xfff0dc, 3.2);
sunLight.position.copy(sun).multiplyScalar(40);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(4096, 4096);
Object.assign(sunLight.shadow.camera, { left: -18, right: 18, top: 18, bottom: -18, near: 1, far: 120 });
sunLight.shadow.bias = -0.00025;
sunLight.shadow.normalBias = 0.025;
sunLight.shadow.radius = 3;
scene.add(sunLight, sunLight.target);
scene.add(new THREE.HemisphereLight(0xcfe0ff, 0x6b6257, 0.35));

// ================================================================ the baseplate
function canvasTex(size, draw) {
  const c = document.createElement("canvas"); c.width = c.height = size;
  draw(c.getContext("2d"), size);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
const plateColor = canvasTex(1024, (g, n) => {
  g.fillStyle = "#7b7d80"; g.fillRect(0, 0, n, n);
  // large soft tonal variation, fine grain, and a faint 4 m grid like a studio baseplate
  for (let i = 0; i < 70; i++) { const v = rand(110, 135) | 0; g.fillStyle = `rgba(${v},${v + 1},${v + 3},0.06)`; g.beginPath(); g.arc(rand(0, n), rand(0, n), rand(60, 260), 0, 7); g.fill(); }
  for (let i = 0; i < 60000; i++) { const v = rand(90, 160) | 0; g.fillStyle = `rgba(${v},${v},${v},0.06)`; g.fillRect(rand(0, n), rand(0, n), 1.5, 1.5); }
  g.strokeStyle = "rgba(40,42,46,0.35)"; g.lineWidth = 3;
  g.strokeRect(1.5, 1.5, n - 3, n - 3);
  g.strokeStyle = "rgba(40,42,46,0.12)"; g.lineWidth = 2;
  for (let i = 1; i < 4; i++) { g.beginPath(); g.moveTo(i * n / 4, 0); g.lineTo(i * n / 4, n); g.moveTo(0, i * n / 4); g.lineTo(n, i * n / 4); g.stroke(); }
});
plateColor.colorSpace = THREE.SRGBColorSpace;
const plateRough = canvasTex(512, (g, n) => {
  g.fillStyle = "#c8c8c8"; g.fillRect(0, 0, n, n);
  for (let i = 0; i < 40; i++) { const v = rand(150, 230) | 0; g.fillStyle = `rgba(${v},${v},${v},0.25)`; g.beginPath(); g.arc(rand(0, n), rand(0, n), rand(30, 120), 0, 7); g.fill(); }
});
for (const t of [plateColor, plateRough]) t.repeat.set(100, 100);
const plate = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshStandardMaterial({ map: plateColor, roughnessMap: plateRough, roughness: 1, metalness: 0 }));
plate.rotation.x = -Math.PI / 2;
plate.receiveShadow = true;

// a few walls and crates: things for blood to hit and run down, and for bodies to fall against
const props = [];
const concreteTex = canvasTex(256, (g, n) => {
  g.fillStyle = "#9a9993"; g.fillRect(0, 0, n, n);
  for (let i = 0; i < 9000; i++) { const v = rand(120, 175) | 0; g.fillStyle = `rgba(${v},${v},${v - 4},0.25)`; g.fillRect(rand(0, n), rand(0, n), 2, 2); }
  g.strokeStyle = "rgba(60,60,58,0.35)"; g.lineWidth = 2; g.strokeRect(1, 1, n - 2, n - 2);
});
concreteTex.colorSpace = THREE.SRGBColorSpace;
const crateTex = canvasTex(256, (g, n) => {
  g.fillStyle = "#8a6a43"; g.fillRect(0, 0, n, n);
  for (let y = 0; y < n; y += 32) { g.fillStyle = `rgba(0,0,0,${rand(0.05, 0.15)})`; g.fillRect(0, y, n, 30); g.fillStyle = "rgba(40,25,10,0.5)"; g.fillRect(0, y + 30, n, 2); }
  g.strokeStyle = "#4a3520"; g.lineWidth = 14; g.strokeRect(7, 7, n - 14, n - 14);
  g.beginPath(); g.moveTo(10, 10); g.lineTo(n - 10, n - 10); g.stroke();
});
crateTex.colorSpace = THREE.SRGBColorSpace;
function addProp(w, h, d, x, z, rotY, tex, repeat) {
  const t = tex.clone(); t.needsUpdate = true; t.repeat.set(repeat ? w / 2 : 1, repeat ? h / 2 : 1);
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ map: t, roughness: 0.9 }));
  m.position.set(x, h / 2, z); m.rotation.y = rotY;
  m.castShadow = true; m.receiveShadow = true;
  scene.add(m); m.updateMatrixWorld(true);
  const body = new CANNON.Body({ mass: 0, material: propMat, shape: new CANNON.Box(new CANNON.Vec3(w / 2, h / 2, d / 2)) });
  body.position.set(x, h / 2, z); body.quaternion.setFromEuler(0, rotY, 0);
  props.push({ mesh: m, body, half: new THREE.Vector3(w / 2, h / 2, d / 2), inv: m.matrixWorld.clone().invert() });
  return body;
}
scene.add(plate);

// ================================================================ post-processing
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.14, 0.5, 0.95);
composer.addPass(bloom);
composer.addPass(new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uTime: { value: 0 } },
  vertexShader: "varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }",
  // gentle vignette and film grain, nothing showy
  fragmentShader: `uniform sampler2D tDiffuse; uniform float uTime; varying vec2 vUv;
    float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233)) + uTime) * 43758.5453); }
    void main(){ vec4 c = texture2D(tDiffuse, vUv); vec2 d = vUv - 0.5; c.rgb *= 1.0 - dot(d, d) * 0.55; c.rgb += (h(vUv * 800.0) - 0.5) * 0.012; gl_FragColor = c; }`,
}));
composer.addPass(new OutputPass());

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
});

// ================================================================ sound (synthesised, no files)
const Sound = (() => {
  let ctx = null, master, verb, nbuf;
  function init() {
    if (ctx) { ctx.resume(); return; }
    ctx = new AudioContext();
    master = ctx.createDynamicsCompressor(); master.threshold.value = -12; master.ratio.value = 5;
    const vol = ctx.createGain(); vol.gain.value = 0.85; master.connect(vol); vol.connect(ctx.destination);
    // an open-air tail: short, bright early reflection and a long faint decay
    const conv = ctx.createConvolver(), len = (ctx.sampleRate * 2.2) | 0, ir = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 5) * (i < 900 ? 0.3 : 1); }
    conv.buffer = ir; verb = ctx.createGain(); verb.gain.value = 0.22; verb.connect(conv); conv.connect(master);
    nbuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const nd = nbuf.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
  }
  const ok = () => ctx && ctx.state === "running";
  function out(pos, wet = 1) {
    const g = ctx.createGain(); let tail = g;
    if (pos) {
      const p = ctx.createPanner(); p.panningModel = "HRTF"; p.distanceModel = "inverse"; p.refDistance = 3; p.rolloffFactor = 1;
      p.positionX.value = pos.x; p.positionY.value = pos.y; p.positionZ.value = pos.z; g.connect(p); tail = p;
    }
    tail.connect(master);
    if (wet) { const w = ctx.createGain(); w.gain.value = wet; tail.connect(w); w.connect(verb); }
    return g;
  }
  function noise(d, t, dur, type, f, q, gain, att = 0.002) {
    const s = ctx.createBufferSource(); s.buffer = nbuf;
    const fl = ctx.createBiquadFilter(); fl.type = type; fl.frequency.value = f; fl.Q.value = q;
    const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + att); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(fl); fl.connect(g); g.connect(d); s.start(t, Math.random() * 1.5); s.stop(t + dur + 0.05);
  }
  function tone(d, t, dur, f0, f1, gain, type = "sine") {
    const o = ctx.createOscillator(); o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
    const g = ctx.createGain(); g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(d); o.start(t); o.stop(t + dur + 0.05);
  }
  return {
    init,
    listener(cam) {
      if (!ok()) return;
      const l = ctx.listener, p = cam.position, f = V().set(0, 0, -1).applyQuaternion(cam.quaternion), u = V().set(0, 1, 0).applyQuaternion(cam.quaternion);
      if (l.positionX) { l.positionX.value = p.x; l.positionY.value = p.y; l.positionZ.value = p.z; l.forwardX.value = f.x; l.forwardY.value = f.y; l.forwardZ.value = f.z; l.upX.value = u.x; l.upY.value = u.y; l.upZ.value = u.z; }
    },
    shot(kind = "pistol") {
      if (!ok()) return; const t = ctx.currentTime, d = out(null, 1.3);
      if (kind === "shotgun") { noise(d, t, 0.5, "lowpass", 900, 0.5, 1.1); tone(d, t, 0.3, 110, 30, 1); noise(d, t + 0.03, 1.4, "bandpass", 300, 0.4, 0.2, 0.05); }
      if (kind === "rifle") { noise(d, t, 0.05, "highpass", 3000, 0.4, 0.9); tone(d, t, 0.1, 220, 60, 0.6); }
      noise(d, t, 0.06, "highpass", 2000, 0.4, 0.8);
      noise(d, t, 0.25, "lowpass", 1500, 0.6, 0.85);
      tone(d, t, 0.16, 160, 42, 0.85);
      noise(d, t + 0.02, 0.9, "bandpass", 420, 0.4, 0.12, 0.03); // distant slap-back
    },
    click(gain = 0.25, f = 2600) { if (!ok()) return; const t = ctx.currentTime, d = out(null, 0.2); noise(d, t, 0.03, "bandpass", f, 3, gain); tone(d, t, 0.02, f * 1.3, f, gain * 0.4, "triangle"); },
    magOut() { this.click(0.3, 2100); },
    magIn() { if (!ok()) return; const t = ctx.currentTime, d = out(null, 0.2); noise(d, t, 0.05, "bandpass", 1500, 3, 0.35); tone(d, t, 0.04, 950, 520, 0.12, "triangle"); },
    pump() { if (!ok()) return; const t = ctx.currentTime, d = out(null, 0.3); noise(d, t, 0.07, "bandpass", 1200, 2, 0.45); noise(d, t + 0.16, 0.08, "bandpass", 1700, 2, 0.5); },
    rack() { if (!ok()) return; const t = ctx.currentTime, d = out(null, 0.3); noise(d, t, 0.05, "bandpass", 1900, 3, 0.3); noise(d, t + 0.11, 0.06, "bandpass", 2700, 3, 0.38); },
    shell(pos) { if (!ok()) return; const t = ctx.currentTime, d = out(pos, 0.2), f = rand(4300, 6200); tone(d, t, 0.16, f, f * 0.97, 0.07); tone(d, t, 0.1, f * 1.5, f * 1.49, 0.03); },
    ricochet(pos) { if (!ok()) return; const t = ctx.currentTime, d = out(pos, 0.6); noise(d, t, 0.03, "highpass", 3000, 1, 0.6); const f = rand(2200, 3400); tone(d, t, 0.35, f, f * 0.45, 0.22, "sine"); tone(d, t, 0.08, 800, 400, 0.3, "triangle"); },
    flesh(pos) { if (!ok()) return; const t = ctx.currentTime, d = out(pos, 0.3); noise(d, t, 0.14, "lowpass", 620, 1.2, 0.7); noise(d, t + 0.01, 0.2, "bandpass", 230, 2.4, 0.45); tone(d, t, 0.12, 105, 45, 0.5); },
    crack(pos) { if (!ok()) return; const t = ctx.currentTime, d = out(pos, 0.3); for (let i = 0; i < 4; i++) noise(d, t + i * 0.011, 0.035, "bandpass", rand(1300, 2600), 4, 0.3); this.flesh(pos); },
    thud(pos, s) {
      if (!ok()) return; const t = ctx.currentTime, d = out(pos, 0.35), g = Math.min(1, s / 5);
      tone(d, t, 0.22, 85, 34, 0.75 * g); noise(d, t, 0.16, "lowpass", 380, 1, 0.55 * g); noise(d, t, 0.35, "bandpass", 900, 0.8, 0.12 * g); // body + cloth + grit
    },
    drip(pos) { if (!ok()) return; const t = ctx.currentTime, d = out(pos, 0.1), f = rand(900, 1500); tone(d, t, 0.06, f, f * 1.8, 0.05); },
    step(gain) { if (!ok()) return; const t = ctx.currentTime, d = out(null, 0.05); noise(d, t, 0.08, "lowpass", 450, 1, gain); noise(d, t, 0.04, "highpass", 3000, 1, gain * 0.25); },
    // wet, bubbling breaths through blood
    gurgle(pos, s = 1) {
      if (!ok()) return; const t = ctx.currentTime, d = out(pos, 0.15);
      for (let i = 0; i < 9; i++) noise(d, t + i * rand(0.035, 0.07), rand(0.04, 0.09), "bandpass", rand(260, 620), 6, 0.16 * s);
      noise(d, t, 0.6, "bandpass", 500, 1.5, 0.06 * s, 0.1);
    },
    // a blade cutting the air: a band of noise that sweeps up in pitch
    whoosh(power = 1) {
      if (!ok()) return; const t = ctx.currentTime, d = out(null, 0.15);
      const src = ctx.createBufferSource(); src.buffer = nbuf;
      const f = ctx.createBiquadFilter(); f.type = "bandpass"; f.Q.value = 1.4;
      f.frequency.setValueAtTime(350, t); f.frequency.exponentialRampToValueAtTime(1900 * power, t + 0.16);
      const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.32 * power, t + 0.06); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.24);
      src.connect(f); f.connect(g); g.connect(d); src.start(t, Math.random()); src.stop(t + 0.3);
    },
    slice(pos) { if (!ok()) return; const t = ctx.currentTime, d = out(pos, 0.3); noise(d, t, 0.12, "highpass", 2400, 0.8, 0.3); noise(d, t, 0.18, "lowpass", 700, 1.2, 0.55); tone(d, t, 0.1, 140, 60, 0.35); },
    stab(pos) { if (!ok()) return; const t = ctx.currentTime, d = out(pos, 0.3); noise(d, t, 0.22, "lowpass", 500, 1.5, 0.7); tone(d, t, 0.16, 95, 40, 0.6); noise(d, t + 0.02, 0.1, "bandpass", 1600, 4, 0.18); },
    sever(pos) { if (!ok()) return; const t = ctx.currentTime, d = out(pos, 0.35); for (let i = 0; i < 4; i++) noise(d, t + i * 0.012, 0.04, "bandpass", rand(1300, 2600), 4, 0.35); noise(d, t, 0.35, "lowpass", 600, 1, 0.6); tone(d, t, 0.25, 80, 35, 0.5); },
    clang(pos) { if (!ok()) return; const t = ctx.currentTime, d = out(pos, 0.5); for (const f of [rand(1500, 1900), rand(3100, 3700), rand(5200, 6000)]) tone(d, t, 0.6, f, f * 0.995, 0.09, "triangle"); noise(d, t, 0.04, "highpass", 3500, 1, 0.4); },
    // a body settling: heavy low thump, cloth, a little kit
    slump(pos) {
      if (!ok()) return; const t = ctx.currentTime, d = out(pos, 0.35);
      tone(d, t, 0.35, 70, 30, 0.85); noise(d, t, 0.3, "lowpass", 300, 1, 0.6); noise(d, t + 0.05, 0.5, "bandpass", 1400, 0.7, 0.12, 0.05);
      this.gear(pos, 1.2);
    },
    // buckles, magazines and plates knocking
    gear(pos, s = 1) {
      if (!ok()) return; const t = ctx.currentTime, d = out(pos, 0.25);
      const n = 2 + Math.floor(Math.random() * 3 * s);
      for (let i = 0; i < n; i++) { const tt = t + rand(0, 0.12), f = rand(1800, 4200); tone(d, tt, rand(0.04, 0.09), f, f * 0.97, 0.05 * s, "triangle"); noise(d, tt, 0.02, "bandpass", f, 6, 0.08 * s); }
    },
    cough(pos) {
      if (!ok()) return; const t = ctx.currentTime, d = out(pos, 0.15);
      for (const o of [0, 0.22]) { noise(d, t + o, 0.18, "lowpass", 900, 0.8, 0.35); noise(d, t + o, 0.12, "bandpass", 300, 3, 0.25, 0.004); }
      noise(d, t + 0.05, 0.3, "bandpass", 450, 5, 0.1, 0.03); // wet
    },
    breath(pos) { if (!ok()) return; const t = ctx.currentTime, d = out(pos, 0.1); noise(d, t, 0.5, "bandpass", 700, 1.2, 0.08, 0.15); },
  };
})();

// ================================================================ physics
const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -9.82, 0) });
world.broadphase = new CANNON.SAPBroadphase(world);
world.allowSleep = true;
world.solver.iterations = 30;
const groundMat = new CANNON.Material("ground"), fleshMat = new CANNON.Material("flesh"), propMat = new CANNON.Material("prop");
world.addContactMaterial(new CANNON.ContactMaterial(groundMat, fleshMat, { friction: 0.8, restitution: 0, contactEquationStiffness: 5e6, contactEquationRelaxation: 5, frictionEquationStiffness: 5e6, frictionEquationRelaxation: 5 }));
const ground = new CANNON.Body({ mass: 0, material: groundMat, shape: new CANNON.Plane() });

    { t: 0.2, p: v3(0.04 * d, -0.17, -0.48), q: bladeQ(v3(0.45 * d, 0.2, -0.85), e), ease: "lin" },       // cutting through in front
    { t: 0.27, p: v3(-0.28 * d, -0.3, -0.44), q: bladeQ(v3(-0.75 * d, -0.3, -0.55), e), ease: "out" }, // followed through low across the body
    { t: 0.36, p: v3(-0.32 * d, -0.36, -0.42), q: bladeQ(v3(-0.8 * d, -0.4, -0.4), e) },              // momentum carries it a little further
    { t: 0.5, p: v3(0.1, -0.62, -0.36), q: bladeQ(v3(0.2, 0.3, -0.9), v3(-1, 0, 0)) },               // drops out of view while it comes back
    { t: 0.68 },

  keys.hit = [0.12, 0.29];

}
const STAB_KEYS = (() => {
  const dir = v3(-0.12, 0.12, -1.6), e = v3(0, 1, 0).cross(dir); // flat blade, point at the crosshair
  const k = [
    { t: 0.16, p: v3(0.22, -0.24, -0.22), q: bladeQ(dir, e), ease: "in" },  // drawn back
    { t: 0.25, p: v3(0.08, -0.2, -0.72), q: bladeQ(dir, e), ease: "out" }, // thrust
    { t: 0.36, p: v3(0.09, -0.21, -0.68), q: bladeQ(dir, e) },              // held in
    { t: 0.52 },
  ];
  k.hit = [0.17, 0.3];

})();
const ease = x => x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
function updateSword(realDt, dt, moving, sprint) {
  const bob = Math.min(1, moving / 4);
  let px = 0.27 + gs.swayX + Math.cos(gs.bob) * 0.012 * bob, py = -0.3 + gs.swayY + Math.abs(Math.sin(gs.bob)) * 0.014 * bob - (sprint ? 0.03 : 0), pz = -0.48;
  // resting: blade up and forward, a little canted
  const restQ = new THREE.Quaternion().setFromEuler(new THREE.Euler(-0.75, 0.15, -0.35, "YXZ"));
  const restP = new THREE.Vector3(px, py, pz);
  let P = restP, Q = restQ, active = false;
  if (sw.kind) {
    sw.t += dt;
    const keys = sw.kind === "slash" ? slashKeys(sw.dir) : STAB_KEYS;
    const T = keys[keys.length - 1].t;
    if (sw.t >= T) sw.kind = null;
    else {
      const all = [{ t: 0, p: sw.fromP || restP, q: sw.fromQ || restQ }, ...keys.slice(0, -1), { t: T, p: restP, q: restQ }];
      let i = 0; while (i < all.length - 2 && sw.t > all[i + 1].t) i++;
      const A = all[i], B = all[i + 1], f = THREE.MathUtils.clamp((sw.t - A.t) / (B.t - A.t), 0, 1);
      const k = (A.ease || "inout") === "in" ? f * f : A.ease === "out" ? 1 - (1 - f) * (1 - f) : A.ease === "lin" ? f : ease(f);
      P = A.p.clone().lerp(B.p, k); Q = A.q.clone().slerp(B.q, k);
      active = keys.hit && sw.t > keys.hit[0] && sw.t < keys.hit[1];
    }
  }
  sword.position.copy(P); sword.quaternion.copy(Q);
  sword.updateMatrixWorld(true);
  // blade sample points, swept from last frame so a fast cut can't skip past him
  const pts = [];
  for (let i = 0; i <= 6; i++) pts.push(sword.localToWorld(new THREE.Vector3(0, 0.16 + i * 0.145, 0)));
  if (active && sw.prev.length) {
    for (let i = 0; i < pts.length; i++) {
      const vel = pts[i].clone().sub(sw.prev[i]).divideScalar(Math.max(realDt, 1e-3));
      for (const f of [0.5, 1]) {
        const p = sw.prev[i].clone().lerp(pts[i], f);
        // the blade stops on walls and crates
        const ph = !sw.clanged && propHit(p, sw.prev[i]);
        if (ph) { sw.clanged = true; Sound.clang(ph.point); dust(ph.point, 1, 0xc9c3b8); bulletHole(ph.point, ph.normal, 0.025); break; }
        for (const s of soldiers) {
          const probe = s.probe(p);
          if (!probe || probe.d > 0.035 || sw.hitParts.has(s.id + probe.name)) continue;
          sw.hitParts.add(s.id + probe.name);
          const dir = sw.kind === "stab" ? V().set(0, 0, -1).applyQuaternion(eye.quaternion) : vel.clone().normalize();
          s.bladeHit(p, dir, sw.kind, probe.name, Math.min(1.6, vel.length() / 6));

}

function spawnTarget() {
  const fwd = V().set(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
  const p = player.pos.clone().addScaledVector(fwd, 7);
  new Soldier(p.x, p.z, player.yaw + Math.PI); // facing you
  if (soldiers.length > 3) soldiers[0].remove();
}

// ================================================================ simulation step and render
function update(realDt) {
  const dt = realDt * (slowmo ? 0.3 : 1);
  // player
  const fwd = V().set(-Math.sin(player.yaw), 0, -Math.cos(player.yaw)), right = V().set(-fwd.z, 0, fwd.x);
  const wish = V();
  if (keys.KeyW) wish.add(fwd); if (keys.KeyS) wish.sub(fwd); if (keys.KeyD) wish.add(right); if (keys.KeyA) wish.sub(right);
  const sprint = keys.ShiftLeft && !aiming;
  if (wish.lengthSq()) wish.normalize().multiplyScalar(aiming ? 2 : sprint ? 6 : 3.8);
  const k = 1 - Math.exp(-realDt * (player.onGround ? 11 : 2));
  player.vel.x += (wish.x - player.vel.x) * k; player.vel.z += (wish.z - player.vel.z) * k;
  player.vel.y -= 12 * realDt;
  player.pos.addScaledVector(player.vel, realDt);
  if (player.pos.y <= 0) { player.pos.y = 0; player.vel.y = 0; player.onGround = true; }
  for (const pr of props) { // push the player out of walls and crates
    const l = player.pos.clone().setY(pr.mesh.position.y).applyMatrix4(pr.inv), h = pr.half, r = 0.35;
    if (Math.abs(l.x) < h.x + r && Math.abs(l.z) < h.z + r && player.pos.y < pr.mesh.position.y + h.y) {
      const px = h.x + r - Math.abs(l.x), pz = h.z + r - Math.abs(l.z);
      if (px < pz) l.x = Math.sign(l.x) * (h.x + r); else l.z = Math.sign(l.z) * (h.z + r);
      const back = l.applyMatrix4(pr.mesh.matrixWorld); player.pos.x = back.x; player.pos.z = back.z;
    }
  }
  const moving = Math.hypot(player.vel.x, player.vel.z);
  if (player.onGround && moving > 0.6) { gs.step -= realDt * moving; if (gs.step <= 0) { gs.step = 1.75; Sound.step(sprint ? 0.16 : 0.1); } }
  player.recoil *= Math.exp(-realDt * 8); player.recoilYaw *= Math.exp(-realDt * 8);
  if (firstPerson) {
    camera.rotation.set(player.pitch + player.recoil, player.yaw + player.recoilYaw, 0);
    eye.rotation.copy(camera.rotation);
    eye.position.set(player.pos.x, player.pos.y + 1.6, player.pos.z);
  } else {
    camera.rotation.set(player.pitch + player.recoil, player.yaw + player.recoilYaw, 0);
    const fwd = V().set(0, 0, -1).applyQuaternion(camera.quaternion), right = V().set(1, 0, 0).applyQuaternion(camera.quaternion);
    const pivot = V().set(player.pos.x, player.pos.y + 1.6, player.pos.z);
    const shoulder = pivot.clone().addScaledVector(right, THREE.MathUtils.lerp(0.75, 0.55, gs.ads)).add(V().set(0, 0.12, 0));
    const dist = THREE.MathUtils.lerp(2.7, 1.3, gs.ads);
    let want = shoulder.clone().addScaledVector(fwd, -dist);
    const back = want.clone().sub(pivot), bl = back.length();
    camRay.set(pivot, back.divideScalar(bl)); camRay.far = bl + 0.2;
    const blk = camRay.intersectObjects(props.map(p => p.mesh), false)[0];
    if (blk) want = pivot.clone().addScaledVector(back, Math.max(0.3, blk.distance - 0.2));
    camera.position.copy(want);
    // aim point: what's under the crosshair, roughly; the eye frame (and so the gun) turns toward it
    camera.updateMatrixWorld();
    eye.position.set(player.pos.x, player.pos.y + 1.6, player.pos.z);
    const aimAt = camera.position.clone().addScaledVector(fwd, 30);
    const ad = aimAt.sub(eye.position);
    eye.rotation.set(Math.atan2(ad.y, Math.hypot(ad.x, ad.z)), Math.atan2(-ad.x, -ad.z), 0);
  }
  camera.fov += ((aiming ? 48 : 65) - camera.fov) * (1 - Math.exp(-realDt * 14)); camera.updateProjectionMatrix();
  // sun shadows follow the player
  sunLight.target.position.set(player.pos.x, 0, player.pos.z - 4);
  sunLight.position.copy(sunLight.target.position).addScaledVector(sun, 40);
  sunLight.target.updateMatrixWorld();

  // gun
  gs.cd -= realDt;
  gs.ads += ((aiming && !gs.reloading ? 1 : 0) - gs.ads) * (1 - Math.exp(-realDt * 16));
  gs.swayX += (-md.x * 0.0002 - gs.swayX) * (1 - Math.exp(-realDt * 10)); gs.swayY += (md.y * 0.0002 - gs.swayY) * (1 - Math.exp(-realDt * 10)); md.x = md.y = 0;
  gs.bob += realDt * moving * 1.7;
  gs.kickV += (-gs.kick * 400 - gs.kickV * 25) * realDt; gs.kick += gs.kickV * realDt;
  gs.slide = Math.max(0, gs.slide - realDt * 14);
  if (firing && W.auto && weapon !== "sword" && locked) shoot();
  const offs = firstPerson ? W.fps : W.tps;
  const base = new THREE.Vector3(...offs[0]).lerp(new THREE.Vector3(...offs[1]), gs.ads);
  const bob = (1 - gs.ads * 0.85) * Math.min(1, moving / 4);
  const gp = base.clone();
  gp.x += Math.cos(gs.bob) * 0.011 * bob + gs.swayX * (1 - gs.ads * 0.7);
  gp.y += Math.abs(Math.sin(gs.bob)) * 0.012 * bob + gs.swayY * (1 - gs.ads * 0.7) - (sprint ? 0.03 : 0);
  gp.z += gs.kick * 0.8;
  let rx = gs.kick * 3, rz = gs.swayX * 3 + (sprint ? 0.3 : 0);
  if (gs.reloading) {
    gs.rt += realDt; const t = gs.rt / W.reload;
    const tilt = Math.sin(Math.min(1, t * 1.2) * Math.PI);
    rz += tilt * 0.5; rx += tilt * 0.2; gp.y -= tilt * 0.035;
    if (W.pump) { mag.visible = t > 0.2 && t < 0.8; mag.position.copy(magHome).y -= (1 - Math.min(1, Math.max(0, (t - 0.2) / 0.5))) * 0.08; if (t > 0.6 && gs.stage < 2) { gs.stage = 2; Sound.magIn(); } if (t > 0.85 && gs.stage < 3) { gs.stage = 3; Sound.pump(); } }
    else if (t < 0.25) mag.position.copy(magHome).y -= (t / 0.25) * 0.13;
    else if (t < 0.55) { if (gs.stage < 1) { gs.stage = 1; Sound.magOut(); } mag.visible = false; }
    else if (t < 0.8) { mag.visible = true; mag.position.copy(magHome).y -= (1 - (t - 0.55) / 0.25) * 0.13; if (t > 0.74 && gs.stage < 2) { gs.stage = 2; Sound.magIn(); } }
    else { mag.position.copy(magHome); if (gs.stage < 3) { gs.stage = 3; Sound.rack(); } gs.slide = Math.max(gs.slide, Math.sin((t - 0.8) / 0.2 * Math.PI)); }
    if (t >= 1) { gs.reloading = false; W.ammo = W.size; magEl.textContent = W.ammo; mag.visible = true; mag.position.copy(magHome); }
  }
  // the shotgun's pump: back and forward after each shot, throwing the empty shell
  if (W.pump && gs.pumpT !== undefined) {
    gs.pumpT += realDt;
    const u = (gs.pumpT - 0.25) / 0.35;
    if (u > 0 && u < 1) { gs.slide = Math.sin(u * Math.PI); if (!gs.pumped) { gs.pumped = true; Sound.pump(); } if (u > 0.4 && !gs.ejected) { gs.ejected = true; ejectShell(); } }
    if (u >= 1) { gs.slide = 0; gs.pumpT = undefined; gs.pumped = gs.ejected = false; }
  }
  slide.position.z = gs.slide * W.slideTravel;
  gun.position.copy(gp); gun.rotation.set(rx, gs.swayX * 2, rz);
  if (weapon === "sword") updateSword(realDt, dt, moving, sprint);
  document.getElementById("dot").style.opacity = 1;
  updateBody(realDt, moving);
  if (firstPerson) { camera.position.copy(eye.position); camera.updateMatrixWorld(); }
  if (flash.visible) { flash.userData.t -= realDt; muzzle.getWorldPosition(flash.position); if (flash.userData.t <= 0) flash.visible = false; }
  flashLight.intensity *= Math.exp(-realDt * 45);
  if (hitT > 0) { hitT -= realDt; if (hitT <= 0) hitEl.style.opacity = 0; }

  // world
  world.step(1 / 180, dt, 12);
  for (const s of soldiers) { s.update(dt); s.bleedTick(dt); }

  // droplets: fly, stretch along their motion, land as puddles
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), sc = V();
  for (let i = 0; i < MAX_DROPS; i++) {
    const d = drops[i];
    if (!d.on) continue;
    d.v.y -= 9.8 * dt; d.v.multiplyScalar(1 - 0.4 * dt);
    d.p.addScaledVector(d.v, dt);
    d.life -= dt;
    const ph = propHit(d.p, d.p.clone().addScaledVector(d.v, -dt));
    if (ph) {
      d.on = false; dropMesh.setMatrixAt(i, ZERO);
      if (Math.random() < 0.7 || d.r > 0.01) surfaceSplat(ph.point, ph.normal, d.r * rand(10, 17));
      continue;
    }
    if (d.p.y <= 0.002) {
      d.on = false; dropMesh.setMatrixAt(i, ZERO);
      const speed = Math.hypot(d.v.x, d.v.z);
      if (Math.random() < 0.75 || d.r > 0.01) splat(d.p.x, d.p.z, d.r * rand(10, 16) * (1 + speed * 0.12), speed > 1.2 ? Math.atan2(-d.v.z, d.v.x) : undefined);
      if ((d.r > 0.012 && Math.random() < 0.2) || (d.r < 0.008 && Math.random() < 0.06)) Sound.drip(d.p);
      continue;
    }
    if (d.life <= 0) { d.on = false; dropMesh.setMatrixAt(i, ZERO); continue; }
    // a moving drop stretches out along its path, so a fast spray reads as streams of liquid
    const sp = d.v.length();
    if (sp > 1e-3) q.setFromUnitVectors(UPV, tmpV.copy(d.v).divideScalar(sp)); else q.identity();
    const st = 1 + Math.min(sp * 0.012 / d.r, 2.2);
    sc.set(d.r / Math.sqrt(st), d.r * st, d.r / Math.sqrt(st));
    m.compose(d.p, q, sc);
    dropMesh.setMatrixAt(i, m);
  }
  dropMesh.instanceMatrix.needsUpdate = true;
  updateFields(dt);
  updateGibs(dt);
  for (const r of runs) if (r.scale.y < r.userData.len) r.scale.y = Math.min(r.userData.len, r.scale.y + r.userData.speed * dt);
  updateFibers(dt);
  updateSparks(dt); sparkLight.intensity *= Math.exp(-dt * 30);
  hitUniforms.uTime.value = performance.now() / 1000;

  // smoke and dust
  for (let i = puffs.length - 1; i >= 0; i--) {
    const s = puffs[i], u = s.userData;
    u.t += dt; const a = u.t / u.life;
    s.position.addScaledVector(u.v, dt); u.v.multiplyScalar(1 - 1.6 * dt);
    s.scale.setScalar(u.size * (1 + a * (u.grow ? 6 : 2.2)));
    s.material.rotation += u.spin * dt;
    s.material.opacity = Math.min(1, a * 8) * (1 - a) * (u.mist ? 0.7 : u.grow ? 0.35 : 0.3);
    if (a >= 1) { scene.remove(s); s.material.dispose(); puffs.splice(i, 1); }
  }
  // shells
  for (const sh of shells) {
    const u = sh.userData; if (u.rest) continue;
    u.v.y -= 9.8 * dt; sh.position.addScaledVector(u.v, dt);
    sh.rotation.x += u.spin.x * dt; sh.rotation.y += u.spin.y * dt; sh.rotation.z += u.spin.z * dt;
    if (sh.position.y < 0.005) {
      sh.position.y = 0.005;
      if (Math.abs(u.v.y) > 0.6) Sound.shell(sh.position.clone());
      u.v.y *= -0.4; u.v.x *= 0.6; u.v.z *= 0.6; u.spin.multiplyScalar(0.5);
      if (Math.abs(u.v.y) < 0.4) { u.rest = true; sh.rotation.set(Math.PI / 2, 0, rand(0, 6.28)); }
    }
  }
  Sound.listener(camera);
}

function render() {
  for (const s of soldiers) s.pose();
  scene.updateMatrixWorld();
  composer.passes[composer.passes.length - 2].uniforms && (composer.passes[composer.passes.length - 2].uniforms.uTime.value = performance.now() * 0.001);
  composer.render();
}

const clock = new THREE.Clock();
function loop() {
  requestAnimationFrame(loop);
  update(Math.min(clock.getDelta(), 0.05));
  render();
}

// ================================================================ start
new GLTFLoader().load("models/Soldier.glb", g => {
  MODEL = g;
  g.scene.traverse(o => { if (o.isSkinnedMesh) for (const m of [].concat(o.material)) addRipple(m); });
  g.scene.updateMatrixWorld(true);
  const head = g.scene.getObjectByName(BN("Head")), foot = g.scene.getObjectByName(BN("LeftFoot"));
  const span = head.getWorldPosition(V()).y - foot.getWorldPosition(V()).y;
  MODEL_SCALE = span > 0.01 ? 1.8 * 0.85 / span : 1;
  new Soldier(0, -6.4, Math.PI); // in front of the wall
  makePlayerBody(); selectGun("pistol");
  document.getElementById("startText").textContent = "Click to start";
  setTimeout(() => (document.getElementById("help").style.opacity = 0), 9000);
}, undefined, e => { document.getElementById("startText").textContent = location.protocol === "file:" ? "Run start.bat to open this through localhost" : "Couldn't load the soldier model"; });
loop();

// testing hooks
window.__game = { setFP: v => { firstPerson = v; }, me: () => me, eye, scene, renderer, sw, sword, setWeapon: w => setWeapon(w), swordAttack: k => swordAttack(k), player, soldiers, camera, shoot: () => { gs.cd = 0; shoot(); }, update, render, spawnTarget };
</script>
